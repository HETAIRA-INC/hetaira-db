<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HETAIRA.EROS // NEURAL TRIGGER MATRIX</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="config.js"></script>

  <style>
    :root {
      --bg: #050206;
      --card-bg: rgba(15, 8, 17, 0.85);
      --card-border: rgba(255, 0, 110, 0.22);
      --card-hover-border: #00f0ff;
      --neon-pink: #ff007f;
      --crimson-lust: #ff003c;
      --blush-glow: #ff4d8d;
      --cyber-cyan: #00f0ff;
      --cyber-cyan-glow: rgba(0, 240, 255, 0.35);
      --amber-trigger: #ffaa00;
      --amber-glow: rgba(255, 170, 0, 0.35);
      --gold-tier: #fcee0a;
      --text-main: #f8fafc;
      --text-muted: #a38896;
      --neon-violet: #bd00ff;
      --neon-violet-glow: rgba(189, 0, 255, 0.4);
      --dark-violet-surface: #14071c; /* Alternative darker card/container layer */
      --toxic-lime: #00ff66;         /* Clean, electric futuristic green */
      --acid-yellow-green: #a6ff00;  /* High-energy hazard accent */
      --matrix-green-glow: rgba(0, 255, 102, 0.25);
      --hazard-orange: #ff5500;      /* Warning badges, overclock states */
      --amber-pulse: #ff8c00;
      --hyper-blue: #1f51ff;         /* Strong contrast against pink & yellow */
      --ice-mint: #50fbe7;           /* Softer, chilled alternative to cyber-cyan */
      --glow-pink-shadow: 0 0 20px rgba(255, 0, 127, 0.45);
      --glow-cyan-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
      --grid-line: rgba(255, 0, 127, 0.08); /* For cyber background grid overlays */
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Cyber Grid & Glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 20%, rgba(255, 0, 110, 0.08) 0%, transparent 50%),
        linear-gradient(to right, rgba(0, 240, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 42px 42px, 42px 42px;
      pointer-events: none;
      z-index: 0;
    }

    /* Futuristic Top Navigation Bar */
    .cyber-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 3, 9, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 0, 127, 0.25);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .nav-container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-decoration: none;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo span {
      color: var(--neon-pink);
      text-shadow: 0 0 20px var(--neon-pink);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      list-style: none;
    }

    .nav-link {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-muted);
      position: relative;
      padding: 6px 2px;
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }

    .nav-link:hover {
      color: #fff;
      text-shadow: 0 0 10px var(--neon-pink);
    }

    .nav-link.active {
      color: var(--neon-pink);
      font-weight: 700;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.7);
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1360px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* Page Header */
    .page-header {
      margin-bottom: 2rem;
      border-left: 3px solid var(--neon-pink);
      padding-left: 1rem;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    .page-title span {
      color: var(--amber-trigger);
      text-shadow: 0 0 15px var(--amber-glow);
    }

    .page-subtitle {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--amber-trigger);
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Filter & Sort Bar */
    .filter-bar {
      background: rgba(16, 9, 18, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      align-items: center;
      justify-content: space-between;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 1px rgba(0, 240, 255, 0.3);
      position: relative;
    }

    .filter-bar::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyber-cyan), var(--amber-trigger), transparent);
    }

    .search-input-wrap {
      flex: 1 1 300px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.85rem 1.1rem;
      outline: none;
      transition: all 0.25s ease;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    .search-input:focus {
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.35), inset 0 0 8px rgba(0, 240, 255, 0.15);
    }

    .filter-dropdowns {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .cyber-select {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--cyber-cyan);
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 1px;
      padding: 0.85rem 1.1rem;
      outline: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cyber-select:hover, .cyber-select:focus {
      border-color: var(--amber-trigger);
      color: var(--amber-trigger);
      box-shadow: 0 0 15px var(--amber-glow);
    }

    .cyber-select option {
      background: #0f0712;
      color: #fff;
    }

    .count-indicator {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--amber-trigger);
      text-shadow: 0 0 10px var(--amber-glow);
      letter-spacing: 1px;
    }

    /* 4-Triggers Per Row Grid Layout */
    .triggers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }

    /* Trigger Card */
    .trigger-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1), 
                  border-color 0.3s ease, 
                  box-shadow 0.3s ease;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      min-height: 220px;
      padding: 1.25rem;
    }

    .trigger-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      background: var(--amber-trigger);
      opacity: 0.5;
      transition: opacity 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .trigger-card:hover {
      transform: translateY(-6px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 30px -10px rgba(0, 240, 255, 0.35), 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .trigger-card:hover::before {
      opacity: 1;
      background: var(--cyber-cyan);
      box-shadow: 0 0 12px var(--cyber-cyan);
    }

    .trigger-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.85rem;
      gap: 0.5rem;
    }

    .trigger-badge-signal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--amber-trigger);
      letter-spacing: 1px;
    }

    .signal-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber-trigger);
      box-shadow: 0 0 6px var(--amber-trigger);
      animation: signalBlink 1.8s infinite ease-in-out;
    }

    @keyframes signalBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .trigger-count-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--cyber-cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 2px 7px;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.15);
      white-space: nowrap;
    }

    .trigger-card-name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.6rem;
      line-height: 1.3;
      letter-spacing: 0.5px;
      word-break: break-word;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .trigger-card:hover .trigger-card-name {
      color: #fff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
    }

    .trigger-card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
      font-weight: 500;
      margin-bottom: 1.2rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .trigger-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(0, 240, 255, 0.15);
      padding-top: 0.75rem;
      margin-top: auto;
    }

    .trigger-action-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--amber-trigger);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s ease;
    }

    .trigger-card:hover .trigger-action-label {
      color: var(--cyber-cyan);
    }

    .trigger-type-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* Scroll/State indicator */
    #scrollTrigger {
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--amber-trigger);
      margin-top: 3rem;
      position: relative;
    }

    /* Responsive Grid Breakpoints */
    @media (max-width: 1200px) {
      .triggers-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 860px) {
      .nav-container {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }
      .nav-links {
        gap: 1.2rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .container { padding: 1.5rem 1rem; }
      .triggers-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-bar { padding: 1rem; }
    }

    @media (max-width: 540px) {
      .triggers-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="cyber-navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        HETAIRA<span>.EROS</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Files</a></li>
        <li><a href="artists.html" class="nav-link">Artists</a></li>
        <li><a href="tags.html" class="nav-link">Tags</a></li>
        <li><a href="triggers.html" class="nav-link active">Triggers</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <header class="page-header">
      <h1 class="page-title">NEURAL <span>// TRIGGER MATRIX</span></h1>
      <p class="page-subtitle">// INDEX OF CONDITIONED AUDITORY ANCHORS, TRANCE HOOKS, AND PSYCHOACOUSTIC REINFORCERS</p>
    </header>

    <!-- Filter & Sort Bar -->
    <div class="filter-bar">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="SEARCH NEURAL TRIGGERS OR COGNITIVE DESCRIPTIONS..." autocomplete="off">
      </div>
      <div class="filter-dropdowns">
        <select id="sortSelect" class="cyber-select" aria-label="Sort Triggers By">
          <option value="COUNT_DESC">SORT: HIGHEST DENSITY</option>
          <option value="COUNT_ASC">SORT: LOWEST DENSITY</option>
          <option value="NAME_ASC">SORT: TRIGGER (A - Z)</option>
          <option value="NAME_DESC">SORT: TRIGGER (Z - A)</option>
        </select>
      </div>
      <div class="count-indicator" id="resultsCount">// SYNCED: 0 ANCHORS</div>
    </div>

    <!-- 4-Column Trigger Grid -->
    <main class="triggers-grid" id="triggersGrid"></main>
    <div id="scrollTrigger">// ENGAGING NEURAL SCAN...</div>
  </div>

  <script>
    let masterTriggers = [];
    let filteredTriggers = [];
    let displayedCount = 0;
    const PAGE_SIZE = 24; // Multiples of 4 to keep clean grid rows

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const triggerUrl = window.resolveDbUrl ? window.resolveDbUrl(window.APP_CONFIG?.TRIGGERS_JSON || 'triggers.json') : 'triggers.json';

        const res = await fetch(triggerUrl, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

        const catalog = await res.json();
        masterTriggers = parseTriggersDataset(catalog);

        document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 180));
        document.getElementById('sortSelect').addEventListener('change', applyFilters);

        applyFilters();
        setupInfiniteScroll();
      } catch (err) {
        console.error('Failed to load triggers:', err);
        document.getElementById('triggersGrid').innerHTML = `
          <div style="grid-column:1/-1; color:var(--crimson-lust); text-align:center; padding:3rem; font-family:var(--font-mono);">
            CRITICAL NEURAL PARSER ERROR: Unable to index sensory triggers.
          </div>`;
      }
    });
    
    // Parse records from  triggers.json
    function parseTriggersDataset(records) {
      if (!Array.isArray(records)) return [];
      
      return records
        .map(item => {
          const count = typeof item.recordCount === 'number' ? item.recordCount : 0;
          return {
            slug: item.slug || '',
            name: item.label || '',
            aliases: Array.isArray(item.aliases) ? item.aliases : [],
            description: item.description || `Specialized vocal operator archived with ${count} erotic audio transmission${count !== 1 ? 's' : ''} in the Hetaira neural databank.`,
            count: count
          };
        });
    }

    function debounce(fn, ms) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), ms);
      };
    }

    // Inspect items for triggers, or trigger-related tags
    function processTriggers(catalog) {
      const counts = {};

      catalog.forEach(item => {
        if (item.status && item.status !== 'ACTIVE') return;

        if (Array.isArray(item.triggers)) {
        item.forEach(rawTrigger => {
          const clean = String(rawTrigger).replace(/^#/, '').trim();
          if (clean) {
            const lower = clean.toLowerCase();
            counts[lower] = counts[lower] || { name: clean, count: 0 };
            counts[lower].count += 1;
          }
        });
      }
      });

      masterTriggers = Object.keys(counts).map(key => {
        const item = counts[key];
        const desc = TRIGGER_DESCRIPTIONS[key] || 
          `Conditioned acoustic cue programmed to induce ${item.name.toLowerCase()} reactions, subconscious responsiveness, and focus compliance.`;
        return {
          name: item.name,
          lowerName: key,
          count: item.count,
          description: desc
        };
      });
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const sort = document.getElementById('sortSelect').value;

      filteredTriggers = masterTriggers.filter(t => {
        return !query || t.lowerName.includes(query) || t.description.toLowerCase().includes(query);
      });

      filteredTriggers.sort((a, b) => {
        if (sort === 'COUNT_DESC') return b.count - a.count;
        if (sort === 'COUNT_ASC') return a.count - b.count;
        if (sort === 'NAME_ASC') return a.name.localeCompare(b.name);
        if (sort === 'NAME_DESC') return b.name.localeCompare(a.name);
        return 0;
      });

      document.getElementById('resultsCount').textContent = `// SYNCED: ${filteredTriggers.length} ANCHORS`;
      
      document.getElementById('triggersGrid').innerHTML = '';
      displayedCount = 0;
      appendNextBatch();
    }

    function appendNextBatch() {
      const grid = document.getElementById('triggersGrid');
      const trigger = document.getElementById('scrollTrigger');

      if (displayedCount >= filteredTriggers.length) {
        trigger.textContent = filteredTriggers.length > 0 ? '// END OF TRIGGER MATRIX' : '// NO MATCHING ANCHORS LOCATED';
        return;
      }

      const nextSlice = filteredTriggers.slice(displayedCount, displayedCount + PAGE_SIZE);
      const fragment = document.createDocumentFragment();

      nextSlice.forEach((item, idx) => {
        const card = document.createElement('a');
        // Navigates back to files with search filter set
        //card.href = `index.html?search=${encodeURIComponent(item.name)}`;
        // Inside tags.html appendNextBatch():
        card.href = `trigger.html?trigger=${encodeURIComponent(item.slug)}`;
        card.className = 'trigger-card';
        card.setAttribute('aria-label', `Trigger: ${item.name}, found in ${item.count} protocols`);

        const indexHex = (displayedCount + idx + 1).toString(16).padStart(3, '0').toUpperCase();

        card.innerHTML = `
          <div>
            <div class="trigger-card-top">
              <span class="trigger-badge-signal">
                <span class="signal-dot"></span>
                SIG::0x${indexHex}
              </span>
              <span class="trigger-count-badge">${item.count} ${item.count === 1 ? 'FILE' : 'FILES'}</span>
            </div>
            
            <h2 class="trigger-card-name">⚡ ${item.name}</h2>
            <p class="trigger-card-desc">${item.description}</p>
          </div>

          <div class="trigger-card-footer">
            <span class="trigger-action-label">EXECUTE QUERY ↗</span>
            <span class="trigger-type-label">NEURAL.ANCHOR</span>
          </div>
        `;

        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
      displayedCount += nextSlice.length;

      trigger.textContent = displayedCount >= filteredTriggers.length ? '// END OF TRIGGER MATRIX' : '// SCROLL FOR MORE ANCHORS...';
    }

    function setupInfiniteScroll() {
      const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) {
          appendNextBatch();
        }
      }, { rootMargin: '200px' });

      observer.observe(document.getElementById('scrollTrigger'));
    }
  </script>
</body>
</html>
