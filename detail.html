<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER.EROS // AUDIO TELEMETRY</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070408;
      --card-bg: rgba(18, 10, 19, 0.94);
      --neon-pink: #ff007f;
      --crimson-lust: #ff003c;
      --blush-glow: #ff4d8d;
      --cyber-cyan: #00f0ff;
      --gold-tier: #fcee0a;
      --text-main: #f8fafc;
      --text-muted: #b89ca9;
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    .detail-container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--neon-pink);
      box-shadow: 0 0 45px rgba(255, 0, 85, 0.3);
      padding: 3rem 2.5rem;
      backdrop-filter: blur(20px);
      clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--blush-glow);
      text-decoration: none;
      margin-bottom: 2rem;
      letter-spacing: 2px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: #fff;
      transform: translateX(-5px);
    }

    .hud-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 2.5rem;
    }

    @media (max-width: 890px) {
      .hud-grid { grid-template-columns: 1fr; }
    }

    /* Left Column: Media & Cyber Audio Console */
    .media-col {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .cover-frame {
      width: 100%;
      height: 360px;
      background: #140816;
      border: 1px solid rgba(255, 0, 85, 0.4);
      position: relative;
      overflow: hidden;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Cyber Custom Audio Console */
    .audio-console {
      background: rgba(255, 0, 85, 0.06);
      border: 1px solid rgba(255, 0, 85, 0.35);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .equalizer-canvas {
      width: 100%;
      height: 48px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 0, 85, 0.2);
    }

    .scrubber-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--cyber-cyan);
    }

    .cyber-range {
      flex-grow: 1;
      accent-color: var(--neon-pink);
      cursor: pointer;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .play-btn {
      background: linear-gradient(90deg, var(--crimson-lust), var(--neon-pink));
      border: none;
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.8rem;
      padding: 8px 18px;
      letter-spacing: 2px;
      cursor: pointer;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      box-shadow: 0 0 15px var(--neon-pink);
    }

    .speed-btn {
      background: transparent;
      border: 1px solid rgba(255, 0, 85, 0.4);
      color: var(--blush-glow);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 4px 8px;
      cursor: pointer;
    }

    /* Right Column: Information */
    .info-col {
      display: flex;
      flex-direction: column;
    }

    .uuid-tag-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .uuid-tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--cyber-cyan);
      word-break: break-all;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--cyber-cyan);
      color: var(--cyber-cyan);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 2px 6px;
      cursor: pointer;
    }

    .title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 2.7rem);
      color: #fff;
      margin-bottom: 0.4rem;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
    }

    .primary-tag {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--blush-glow);
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
    }

    /* Metadata HUD Grid */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-bottom: 1.8rem;
    }

    .meta-box {
      background: rgba(255, 0, 85, 0.05);
      border-left: 3px solid var(--crimson-lust);
      padding: 0.8rem 1rem;
    }

    .meta-label {
      font-family: var(--font-display);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .meta-val {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: #fff;
      font-weight: 700;
    }

    .description {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 1.8rem;
    }

    /* Section badges */
    .section-wrap {
      margin-bottom: 1.4rem;
    }

    .section-heading {
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      color: var(--blush-glow);
      margin-bottom: 0.6rem;
    }

    .badge-collection {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .hud-badge-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 4px 10px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyber-cyan);
      color: #fff;
    }

    .hud-badge-trigger {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 4px 10px;
      background: rgba(255, 0, 85, 0.1);
      border: 1px solid var(--neon-pink);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="detail-container" id="hudContainer">
    <div style="text-align: center; color: var(--blush-glow); font-family: var(--font-display);">
      INITIALIZING AUDIO HUD...
    </div>
  </div>

  <script>
    let audioInstance = null;
    let visualizerInterval = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const targetId = urlParams.get('id');
      const container = document.getElementById('hudContainer');

      if (!targetId) {
        container.innerHTML = `
          <a href="index.html" class="back-btn">&larr; RETURN TO ARCHIVE</a>
          <h2 style="color:var(--crimson-lust);">NO FILE UUID SPECIFIED</h2>
        `;
        return;
      }

      try {
        const res = await fetch('data.json');
        const items = await res.json();
        const item = items.find(i => i.uuid === targetId || i.id === targetId);

        if (!item) {
          container.innerHTML = `
            <a href="index.html" class="back-btn">&larr; RETURN TO ARCHIVE</a>
            <h2 style="color:var(--crimson-lust);">RECORD [${targetId}] NOT FOUND</h2>
          `;
          return;
        }

        const tags = Array.isArray(item.tags) ? item.tags : [];
        const triggers = Array.isArray(item.triggers) ? item.triggers : [];
        const tones = Array.isArray(item.tone) ? item.tone.join(', ') : (item.tone || 'NONE');
        const coverImg = item.cover || "${item.cover || ''}";

        container.innerHTML = `
          <a href="index.html" class="back-btn">&larr; TERMINATE LINK // RETURN TO ARCHIVE</a>
          
          <div class="hud-grid">
            <!-- Media & Cyber Player -->
            <div class="media-col">
              <div class="cover-frame">
                <img src="${coverImg}" alt="${item.title}" class="cover-img" onerror="this.src='${item.cover || ''}'">
              </div>

              <!-- Functional Cyber Audio Player -->
              <div class="audio-console">
                <canvas id="equalizer" class="equalizer-canvas"></canvas>
                
                <div class="scrubber-wrap">
                  <span id="currentTime">00:00</span>
                  <input type="range" id="seekSlider" class="cyber-range" value="0" min="0" max="100">
                  <span id="durationTime">--:--</span>
                </div>

                <div class="audio-controls">
                  <button id="playBtn" class="play-btn">PLAY FEED</button>
                  <button id="speedBtn" class="speed-btn">1.0x</button>
                </div>

                <audio id="audioSource" src="${item.file || ''}" preload="metadata"></audio>
              </div>
            </div>

            <!-- Details Dossier -->
            <div class="info-col">
              <div class="uuid-tag-row">
                <span class="uuid-tag">TARGET_UUID: ${item.uuid}</span>
                <!--<button class="copy-btn" onclick="navigator.clipboard.writeText('${item.uuid}'); alert('UUID Copied to Buffer');">COPY</button>-->
              </div>
              
              <h1 class="title">${item.title}</h1>
              <div class="primary-tag">${item.id} // ${item.tag}</div>

              <div class="meta-grid">
                <div class="meta-box">
                  <div class="meta-label">ACCESS TIER</div>
                  <div class="meta-val" style="color:var(--gold-tier);">${item.tier}</div>
                </div>
                <div class="meta-box">
                  <div class="meta-label">AUDIENCE</div>
                  <div class="meta-val">${item.audience}</div>
                </div>
                <div class="meta-box">
                  <div class="meta-label">VOICE ARTIST</div>
                  <div class="meta-val">${item.artist}</div>
                </div>
                <div class="meta-box">
                  <div class="meta-label">AUTHOR / PRODUCER</div>
                  <div class="meta-val">${item.author}</div>
                </div>
                <div class="meta-box">
                  <div class="meta-label">TONAL PROFILE</div>
                  <div class="meta-val" style="color:var(--neon-pink);">${tones}</div>
                </div>
                <div class="meta-box">
                  <div class="meta-label">RELEASE DATE</div>
                  <div class="meta-val">${item.releaseDate}</div>
                </div>
              </div>

              <p class="description">${item.description}</p>

              ${tags.length ? `
                <div class="section-wrap">
                  <div class="section-heading">// THEMATIC TAGS:</div>
                  <div class="badge-collection">
                    ${tags.map(t => `<span class="hud-badge-tag">${t}</span>`).join('')}
                  </div>
                </div>` : ''}

              ${triggers.length ? `
                <div class="section-wrap">
                  <div class="section-heading">// ACOUSTIC TRIGGERS:</div>
                  <div class="badge-collection">
                    ${triggers.map(tr => `<span class="hud-badge-trigger">${tr}</span>`).join('')}
                  </div>
                </div>` : ''}
            </div>
          </div>
        `;

        // Initialize Audio HUD controls
        initCyberAudio();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<h2 style="color:var(--crimson-lust);">TELEMETRY CORRUPTED</h2>`;
      }
    });

    function initCyberAudio() {
      const audio = document.getElementById('audioSource');
      const playBtn = document.getElementById('playBtn');
      const seekSlider = document.getElementById('seekSlider');
      const currentTime = document.getElementById('currentTime');
      const durationTime = document.getElementById('durationTime');
      const speedBtn = document.getElementById('speedBtn');
      const canvas = document.getElementById('equalizer');
      const ctx = canvas.getContext('2d');

      const speeds = [1.0, 1.2, 1.5];
      let speedIdx = 0;

      speedBtn.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        audio.playbackRate = speeds[speedIdx];
        speedBtn.textContent = `${speeds[speedIdx]}x`;
      });

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play().then(() => {
            playBtn.textContent = 'PAUSE FEED';
            startVisualizer(canvas, ctx);
          }).catch(() => {
            alert('Audio file not found locally. Visualizer simulating stream demo.');
            startVisualizer(canvas, ctx);
          });
        } else {
          audio.pause();
          playBtn.textContent = 'RESUME FEED';
          stopVisualizer();
        }
      });

      audio.addEventListener('timeupdate', () => {
        const cur = audio.currentTime;
        const dur = audio.duration || 100;
        seekSlider.value = (cur / dur) * 100;
        currentTime.textContent = formatTime(cur);
      });

      audio.addEventListener('loadedmetadata', () => {
        durationTime.textContent = formatTime(audio.duration);
      });

      seekSlider.addEventListener('input', () => {
        const dur = audio.duration || 100;
        audio.currentTime = (seekSlider.value / 100) * dur;
      });

      function formatTime(s) {
        if (isNaN(s)) return '00:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
      }

      function startVisualizer(c, context) {
        stopVisualizer();
        visualizerInterval = setInterval(() => {
          context.clearRect(0, 0, c.width, c.height);
          const bars = 30;
          const barWidth = c.width / bars;
          for (let i = 0; i < bars; i++) {
            const h = Math.random() * (c.height * 0.85);
            context.fillStyle = i % 2 === 0 ? '#ff007f' : '#00f0ff';
            context.fillRect(i * barWidth, c.height - h, barWidth - 2, h);
          }
        }, 80);
      }

      function stopVisualizer() {
        if (visualizerInterval) clearInterval(visualizerInterval);
      }
    }
  </script>
</body>
</html>
