<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER.EROS // ROOT ADMIN CONSOLE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070408;
      --panel-bg: rgba(18, 10, 19, 0.95);
      --card-border: rgba(255, 0, 85, 0.35);
      --neon-pink: #ff007f;
      --crimson-lust: #ff003c;
      --blush-glow: #ff4d8d;
      --cyber-cyan: #00f0ff;
      --gold-tier: #fcee0a;
      --text-main: #f8fafc;
      --text-muted: #b89ca9;
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Top Nav / Status */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 0, 85, 0.3);
      padding-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    h1 span { color: var(--neon-pink); }

    .nav-actions {
      display: flex;
      gap: 10px;
    }

    .btn-cyber {
      background: rgba(255, 0, 85, 0.1);
      border: 1px solid var(--neon-pink);
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.75rem;
      padding: 8px 16px;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-cyber:hover {
      background: var(--neon-pink);
      box-shadow: 0 0 15px var(--neon-pink);
    }

    .btn-cyan {
      border-color: var(--cyber-cyan);
      color: var(--cyber-cyan);
      background: rgba(0, 240, 255, 0.08);
    }
    .btn-cyan:hover {
      background: var(--cyber-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--cyber-cyan);
    }

    /* Main Dual-Pane Workspace */
    .workspace-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 2rem;
    }

    @media (max-width: 992px) {
      .workspace-grid { grid-template-columns: 1fr; }
    }

    /* Left Panel: Record List */
    .record-panel {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      padding: 1.5rem;
      height: calc(100vh - 150px);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--cyber-cyan);
      letter-spacing: 1px;
    }

    .record-search {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 0, 85, 0.3);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 8px 12px;
      margin-bottom: 1rem;
      outline: none;
    }

    .record-list {
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .record-item {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 0, 85, 0.2);
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .record-item:hover, .record-item.active {
      border-color: var(--neon-pink);
      background: rgba(255, 0, 85, 0.15);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    .item-info {
      overflow: hidden;
    }

    .item-title {
      font-family: var(--font-display);
      font-size: 0.9rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Right Panel: Form Editor */
    .editor-panel {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      padding: 2rem;
      backdrop-filter: blur(15px);
      overflow-y: auto;
      height: calc(100vh - 150px);
    }

    .form-section-title {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--blush-glow);
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px dashed rgba(255, 0, 85, 0.3);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-family: var(--font-display);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input, select, textarea {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 0, 85, 0.3);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .input-addon-group {
      display: flex;
      gap: 6px;
    }

    .input-addon-group input {
      flex-grow: 1;
    }

    .btn-addon {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyber-cyan);
      color: var(--cyber-cyan);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-addon:hover {
      background: var(--cyber-cyan);
      color: #000;
    }

    .editor-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 0, 85, 0.3);
    }

    .status-msg {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--cyber-cyan);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="top-bar">
      <div>
        <h1>Cyber<span>.Admin</span> // Data Matrix Control</h1>
      </div>
      <div class="nav-actions">
        <a href="index.html" class="btn-cyber btn-cyan">&larr; Open Archive Page</a>
        <button class="btn-cyber" onclick="exportJsonFile()">Download data.json</button>
      </div>
    </div>

    <div class="workspace-grid">
      <!-- LEFT: Record List -->
      <aside class="record-panel">
        <div class="panel-header">
          <span>PROTOCOLS (<span id="count">0</span>)</span>
          <button class="btn-cyber" style="padding: 4px 8px;" onclick="createNewRecord()">+ NEW</button>
        </div>
        <input type="text" id="recordFilter" class="record-search" placeholder="Filter list..." oninput="renderRecordList()">
        <div class="record-list" id="recordList">
          <!-- Populated dynamically -->
        </div>
      </aside>

      <!-- RIGHT: Edit Form -->
      <main class="editor-panel">
        <div class="form-section-title">// EDITING PROTOCOL DOSSIER</div>

        <form id="recordForm" onsubmit="saveRecord(event)">
          <div class="form-grid">
            <!-- UUID with generator -->
            <div class="form-group form-full">
              <label>UUID (Universal Identifier)</label>
              <div class="input-addon-group">
                <input type="text" id="uuid" required readonly>
                <button type="button" class="btn-addon" onclick="generateNewUuid()">GENERATE NEW</button>
              </div>
            </div>

            <!-- Title & ID -->
            <div class="form-group">
              <label>Record Title</label>
              <input type="text" id="title" required placeholder="e.g. Synaptic Overdrive Induction">
            </div>

            <div class="form-group">
              <label>Protocol ID</label>
              <input type="text" id="id" required placeholder="e.g. EROS-01">
            </div>

            <!-- Main Tag & Tags Array -->
            <div class="form-group">
              <label>Main Tag (Primary Category)</label>
              <input type="text" id="tag" required placeholder="e.g. NEURAL HYPNOSIS">
            </div>

            <div class="form-group">
              <label>Sub-Tags (Comma Separated)</label>
              <input type="text" id="tags" placeholder="BINAURAL, DEEP TRANCE, SCI-FI">
            </div>

            <!-- Triggers & Tone -->
            <div class="form-group">
              <label>Triggers (Comma Separated)</label>
              <input type="text" id="triggers" placeholder="SLEEP, CLICK, BREATHING">
            </div>

            <div class="form-group">
              <label>Tones (Comma Separated)</label>
              <input type="text" id="tone" placeholder="DOMINANT, BRATTY">
            </div>

            <!-- Tier & Audience Dropdowns -->
            <div class="form-group">
              <label>Access Tier</label>
              <select id="tier">
                <option value="FREE">FREE</option>
                <option value="PAID LEVEL 1">PAID LEVEL 1</option>
                <option value="PAID LEVEL 2">PAID LEVEL 2</option>
                <option value="PAID LEVEL 3">PAID LEVEL 3</option>
              </select>
            </div>

            <div class="form-group">
              <label>Audience</label>
              <select id="audience">
                <option value="F4M">F4M</option>
                <option value="M4F">M4F</option>
                <option value="FF4M">FF4M</option>
                <option value="FFMF4M">FFMF4M</option>
                <option value="F4F">F4F</option>
                <option value="M4M">M4M</option>
                <option value="ANY">ANY</option>
              </select>
            </div>

            <!-- Author & Artist -->
            <div class="form-group">
              <label>Author / Producer</label>
              <input type="text" id="author" placeholder="CipherEros">
            </div>

            <div class="form-group">
              <label>Voice Artist</label>
              <input type="text" id="artist" placeholder="Vesper V">
            </div>

            <!-- Release Date -->
            <div class="form-group form-full">
              <label>Release Date</label>
              <input type="date" id="releaseDate">
            </div>

            <!-- File Paths with Auto-sync -->
            <div class="form-group">
              <label>Cover Art Path</label>
              <div class="input-addon-group">
                <input type="text" id="cover" placeholder="covers/uuid.png">
                <button type="button" class="btn-addon" onclick="syncCoverPath()">SYNC UUID</button>
              </div>
            </div>

            <div class="form-group">
              <label>Audio File Path</label>
              <div class="input-addon-group">
                <input type="text" id="file" placeholder="audio/uuid.mp3">
                <button type="button" class="btn-addon" onclick="syncAudioPath()">SYNC UUID</button>
              </div>
            </div>

            <!-- Description -->
            <div class="form-group form-full">
              <label>Description</label>
              <textarea id="description" placeholder="Sensory file description..."></textarea>
            </div>
          </div>

          <div class="editor-actions">
            <div>
              <button type="button" class="btn-cyber" style="border-color:var(--crimson-lust);" onclick="deleteCurrentRecord()">Delete Record</button>
            </div>
            <div style="display:flex; align-items:center; gap: 1rem;">
              <span id="statusMsg" class="status-msg"></span>
              <button type="submit" class="btn-cyber" style="background:var(--neon-pink);">COMMIT TO DATA.JSON</button>
            </div>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script>
    let records = [];
    let currentSelectedIndex = -1;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('data.json');
        records = await res.json();
        renderRecordList();
        if (records.length > 0) {
          selectRecord(0);
        } else {
          createNewRecord();
        }
      } catch (err) {
        showStatus('Failed to load initial data.json', true);
      }
    });

    function renderRecordList() {
      const list = document.getElementById('recordList');
      const query = document.getElementById('recordFilter').value.toLowerCase();
      document.getElementById('count').textContent = records.length;
      list.innerHTML = '';

      records.forEach((rec, idx) => {
        if (query && !rec.title.toLowerCase().includes(query) && !rec.id.toLowerCase().includes(query)) {
          return;
        }

        const div = document.createElement('div');
        div.className = `record-item ${idx === currentSelectedIndex ? 'active' : ''}`;
        div.onclick = () => selectRecord(idx);

        div.innerHTML = `
          <div class="item-info">
            <div class="item-title">${rec.title || 'Untitled'}</div>
            <div class="item-meta">${rec.id} // ${rec.tier} // ${rec.audience}</div>
          </div>
          <span style="color:var(--blush-glow);">&rarr;</span>
        `;
        list.appendChild(div);
      });
    }

    function selectRecord(index) {
      currentSelectedIndex = index;
      const rec = records[index];

      document.getElementById('uuid').value = rec.uuid || '';
      document.getElementById('id').value = rec.id || '';
      document.getElementById('title').value = rec.title || '';
      document.getElementById('tag').value = rec.tag || '';
      document.getElementById('tags').value = Array.isArray(rec.tags) ? rec.tags.join(', ') : (rec.tags || '');
      document.getElementById('triggers').value = Array.isArray(rec.triggers) ? rec.triggers.join(', ') : (rec.triggers || '');
      document.getElementById('tone').value = Array.isArray(rec.tone) ? rec.tone.join(', ') : (rec.tone || '');
      document.getElementById('tier').value = rec.tier || 'FREE';
      document.getElementById('audience').value = rec.audience || 'F4M';
      document.getElementById('author').value = rec.author || '';
      document.getElementById('artist').value = rec.artist || '';
      document.getElementById('releaseDate').value = rec.releaseDate || '';
      document.getElementById('cover').value = rec.cover || '';
      document.getElementById('file').value = rec.file || '';
      document.getElementById('description').value = rec.description || '';

      renderRecordList();
      showStatus(`Loaded: ${rec.id}`);
    }

    function createNewRecord() {
      currentSelectedIndex = -1;
      document.getElementById('recordForm').reset();
      const newUuid = crypto.randomUUID();
      document.getElementById('uuid').value = newUuid;
      document.getElementById('id').value = `EROS-0${records.length + 1}`;
      document.getElementById('releaseDate').value = new Date().toISOString().split('T')[0];
      syncCoverPath();
      syncAudioPath();
      renderRecordList();
      showStatus('Ready to configure new protocol');
    }

    function generateNewUuid() {
      const u = crypto.randomUUID();
      document.getElementById('uuid').value = u;
      syncCoverPath();
      syncAudioPath();
    }

    function syncCoverPath() {
      const u = document.getElementById('uuid').value;
      if (u) document.getElementById('cover').value = `covers/${u}.png`;
    }

    function syncAudioPath() {
      const u = document.getElementById('uuid').value;
      if (u) document.getElementById('file').value = `audio/${u}.mp3`;
    }

    async function saveRecord(e) {
      e.preventDefault();

      const parseArray = (str) => str.split(',').map(s => s.trim()).filter(Boolean);

      const recordObj = {
        uuid: document.getElementById('uuid').value,
        id: document.getElementById('id').value,
        tag: document.getElementById('tag').value,
        tags: parseArray(document.getElementById('tags').value),
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        triggers: parseArray(document.getElementById('triggers').value),
        tier: document.getElementById('tier').value,
        audience: document.getElementById('audience').value,
        author: document.getElementById('author').value,
        artist: document.getElementById('artist').value,
        releaseDate: document.getElementById('releaseDate').value,
        tone: parseArray(document.getElementById('tone').value),
        cover: document.getElementById('cover').value,
        file: document.getElementById('file').value
      };

      if (currentSelectedIndex >= 0) {
        records[currentSelectedIndex] = recordObj;
      } else {
        records.push(recordObj);
        currentSelectedIndex = records.length - 1;
      }

      renderRecordList();
      await commitToServer();
    }

    async function deleteCurrentRecord() {
      if (currentSelectedIndex < 0) return;
      if (!confirm(`Are you sure you want to delete ${records[currentSelectedIndex].id}?`)) return;

      records.splice(currentSelectedIndex, 1);
      if (records.length > 0) {
        selectRecord(0);
      } else {
        createNewRecord();
      }
      renderRecordList();
      await commitToServer();
    }

    // Sends the payload to server.js to write directly to disk
    async function commitToServer() {
      try {
        const res = await fetch('/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(records)
        });

        if (res.ok) {
          showStatus('SYNCHRONIZED DIRECTLY TO DATA.JSON');
        } else {
          throw new Error('Server responded with error');
        }
      } catch (err) {
        // Fallback notification if server.js isn't running
        showStatus('Running statically: Use "Download data.json" to save', true);
      }
    }

    function exportJsonFile() {
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'data.json';
      a.click();
      showStatus('Downloaded updated data.json');
    }

    function showStatus(msg, isWarn = false) {
      const el = document.getElementById('statusMsg');
      el.textContent = `// ${msg}`;
      el.style.color = isWarn ? 'var(--crimson-lust)' : 'var(--cyber-cyan)';
    }
  </script>
</body>
</html>
