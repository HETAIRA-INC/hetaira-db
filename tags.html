<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HETAIRA.EROS // NEURAL TAG INDEX</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="config.js"></script>

  <style>
    :root {
      --bg: #050206;
      --card-bg: rgba(15, 8, 17, 0.85);
      --card-border: rgba(255, 0, 110, 0.22);
      --card-hover-border: #ff007f;
      --neon-pink: #ff007f;
      --crimson-lust: #ff003c;
      --blush-glow: #ff4d8d;
      --cyber-cyan: #00f0ff;
      --cyber-cyan-glow: rgba(0, 240, 255, 0.35);
      --amber-trigger: #ffaa00;
      --amber-glow: rgba(255, 170, 0, 0.35);
      --gold-tier: #fcee0a;
      --text-main: #f8fafc;
      --text-muted: #a38896;
      --neon-violet: #bd00ff;
      --neon-violet-glow: rgba(189, 0, 255, 0.4);
      --dark-violet-surface: #14071c; /* Alternative darker card/container layer */
      --toxic-lime: #00ff66;         /* Clean, electric futuristic green */
      --acid-yellow-green: #a6ff00;  /* High-energy hazard accent */
      --matrix-green-glow: rgba(0, 255, 102, 0.25);
      --hazard-orange: #ff5500;      /* Warning badges, overclock states */
      --amber-pulse: #ff8c00;
      --hyper-blue: #1f51ff;         /* Strong contrast against pink & yellow */
      --ice-mint: #50fbe7;           /* Softer, chilled alternative to cyber-cyan */
      --glow-pink-shadow: 0 0 20px rgba(255, 0, 127, 0.45);
      --glow-cyan-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
      --grid-line: rgba(255, 0, 127, 0.08); /* For cyber background grid overlays */
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Cyber Grid & Glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 0, 110, 0.12) 0%, transparent 60%),
        linear-gradient(to right, rgba(255, 0, 127, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 127, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 42px 42px, 42px 42px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top Navigation Bar */
    .cyber-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 3, 9, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 0, 127, 0.25);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .nav-container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-decoration: none;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo span {
      color: var(--neon-pink);
      text-shadow: 0 0 20px var(--neon-pink);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      list-style: none;
    }

    .nav-link {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-muted);
      position: relative;
      padding: 6px 2px;
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }

    .nav-link:hover {
      color: #fff;
      text-shadow: 0 0 10px var(--neon-pink);
    }

    .nav-link.active {
      color: var(--neon-pink);
      font-weight: 700;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.7);
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1360px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* Page Header */
    .page-header {
      margin-bottom: 2rem;
      border-left: 3px solid var(--neon-pink);
      padding-left: 1rem;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .page-title span {
      color: var(--cyber-cyan);
      text-shadow: 0 0 15px var(--cyber-cyan-glow);
    }

    .page-subtitle {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--cyber-cyan);
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Futuristic Filter Panel */
    .filter-bar {
      background: rgba(16, 9, 18, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      align-items: center;
      justify-content: space-between;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 1px rgba(255, 0, 127, 0.4);
      position: relative;
    }

    .filter-bar::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-violet), var(--cyber-cyan), transparent);
    }

    .search-input-wrap {
      flex: 1 1 300px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 0, 127, 0.35);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.85rem 1.1rem;
      outline: none;
      transition: all 0.25s ease;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    .search-input:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.35), inset 0 0 8px rgba(255, 0, 127, 0.2);
    }

    .filter-dropdowns {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .cyber-select {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 0, 127, 0.35);
      color: var(--blush-glow);
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 1px;
      padding: 0.85rem 1.1rem;
      outline: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cyber-select:hover, .cyber-select:focus {
      border-color: var(--cyber-cyan);
      color: var(--cyber-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
    }

    .cyber-select option {
      background: #0f0712;
      color: #fff;
    }

    .count-indicator {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--cyber-cyan);
      text-shadow: 0 0 10px var(--cyber-cyan-glow);
      letter-spacing: 1px;
    }

    /* 4-Tags Per Row Grid Layout */
    .tags-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }

    /* Futuristic Tag Card */
    .tag-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1), 
                  border-color 0.3s ease, 
                  box-shadow 0.3s ease;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      min-height: 220px;
      padding: 1.25rem;
    }

    .tag-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      background: var(--cyber-cyan);
      opacity: 0.4;
      transition: opacity 0.3s ease, background 0.3s ease;
    }

    .tag-card:hover {
      transform: translateY(-6px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 30px -10px rgba(255, 0, 110, 0.4), 0 0 15px rgba(255, 0, 110, 0.2);
    }

    .tag-card:hover::before {
      opacity: 1;
      background: var(--neon-pink);
      box-shadow: 0 0 10px var(--neon-pink);
    }

    .tag-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.85rem;
      gap: 0.5rem;
    }

    .tag-badge-prefix {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--cyber-cyan);
      letter-spacing: 1px;
    }

    .tag-count-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gold-tier);
      background: rgba(252, 238, 10, 0.08);
      border: 1px solid rgba(252, 238, 10, 0.3);
      padding: 2px 7px;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(252, 238, 10, 0.15);
      white-space: nowrap;
    }

    .tag-card-name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.6rem;
      line-height: 1.3;
      letter-spacing: 0.5px;
      word-break: break-word;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .tag-card:hover .tag-card-name {
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.8);
    }

    .tag-card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
      font-weight: 500;
      margin-bottom: 1.2rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tag-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 0, 127, 0.15);
      padding-top: 0.75rem;
      margin-top: auto;
    }

    .tag-action-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--cyber-cyan);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s ease;
    }

    .tag-card:hover .tag-action-label {
      color: var(--neon-pink);
    }

    .tag-index-meta {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* Scroll/State indicator */
    #scrollTrigger {
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--blush-glow);
      margin-top: 3rem;
      position: relative;
    }

    /* Responsive Queries */
    @media (max-width: 1200px) {
      .tags-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 860px) {
      .nav-container {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }
      .nav-links {
        gap: 1.2rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .container { padding: 1.5rem 1rem; }
      .tags-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-bar { padding: 1rem; }
    }

    @media (max-width: 540px) {
      .tags-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="cyber-navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        HETAIRA<span>.EROS</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Files</a></li>
        <li><a href="artists.html" class="nav-link">Artists</a></li>
        <li><a href="tags.html" class="nav-link active">Tags</a></li>
        <li><a href="triggers.html" class="nav-link">Triggers</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <header class="page-header">
      <h1 class="page-title">NEURAL <span>// Tag  index</span></h1>
      <p class="page-subtitle">// EXPLORE THE ARCHIVE VIA SPECIALIZED PSYCHOACOUSTIC ATTRIBUTES AND THEMES</p>
    </header>

    <!-- Filter & Sort Bar -->
    <div class="filter-bar">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="SEARCH TAGS OR DESCRIPTIONS..." autocomplete="off">
      </div>
      <div class="filter-dropdowns">
        <select id="sortSelect" class="cyber-select" aria-label="Sort Tags By">
          <option value="COUNT_DESC">SORT: MOST FILES</option>
          <option value="COUNT_ASC">SORT: FEWEST FILES</option>
          <option value="NAME_ASC">SORT: NAME (A - Z)</option>
          <option value="NAME_DESC">SORT: NAME (Z - A)</option>
        </select>
      </div>
      <div class="count-indicator" id="resultsCount">// LOADED: 0 TAGS</div>
    </div>

    <!-- 4-Column Tag Grid -->
    <main class="tags-grid" id="tagsGrid"></main>
    <div id="scrollTrigger">// PARSING ATTRIBUTE MATRIX...</div>
  </div>

  <script>
    let masterTags = [];
    let filteredTags = [];
    let displayedCount = 0;
    const PAGE_SIZE = 24; // Multiples of 4 to keep rows clean

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const tagsUrl = window.resolveDbUrl ? window.resolveDbUrl(window.APP_CONFIG?.TAGS_JSON || 'tags.json') : 'tags.json';

        const res = await fetch(tagsUrl, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

        const catalog = await res.json();
        masterTags = parseTagsDataset(catalog);

        document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 180));
        document.getElementById('sortSelect').addEventListener('change', applyFilters);

        applyFilters();
        setupInfiniteScroll();
      } catch (err) {
        console.error('Failed to load tags:', err);
        document.getElementById('tagsGrid').innerHTML = `
          <div style="grid-column:1/-1; color:var(--crimson-lust); text-align:center; padding:3rem; font-family:var(--font-mono);">
            CRITICAL NEURAL PARSER ERROR: Unable to index taxonomy tags.
          </div>`;
      }
    });

    // Parse records from  tags.json
    function parseTagsDataset(records) {
      if (!Array.isArray(records)) return [];
      
      return records
        .map(item => {
          const count = typeof item.recordCount === 'number' ? item.recordCount : 0;
          return {
            slug: item.slug || '',
            name: item.label || '',
            aliases: Array.isArray(item.aliases) ? item.aliases : [],
            description: item.description || `Specialized vocal operator archived with ${count} erotic audio transmission${count !== 1 ? 's' : ''} in the Hetaira neural databank.`,
            count: count
          };
        });
    }

    function debounce(fn, ms) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), ms);
      };
    }

    // Aggregates and counts tags across the dataset
    function processTags(catalog) {
      const counts = {};

      catalog.forEach(item => {
        if (item.status && item.status !== 'ACTIVE') return;

        if (Array.isArray(item.tags)) {
          item.tags.forEach(rawTag => {
            const cleanTag = String(rawTag).trim();
            if (cleanTag) {
              const lower = cleanTag.toLowerCase();
              counts[lower] = counts[lower] || { name: cleanTag, count: 0 };
              counts[lower].count += 1;
            }
          });
        }
      });

      masterTags = Object.keys(counts).map(key => {
        const item = counts[key];
        const desc = TAG_DESCRIPTIONS[key] || 
          `Specialized acoustic protocol focusing on ${item.name.toLowerCase()} thematic triggers, audio dynamics, and audio-sensory elements.`;
        return {
          name: item.name,
          lowerName: key,
          count: item.count,
          description: desc
        };
      });
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const sort = document.getElementById('sortSelect').value;

      filteredTags = masterTags.filter(t => {
        return !query || t.lowerName.includes(query) || t.description.toLowerCase().includes(query);
      });

      filteredTags.sort((a, b) => {
        if (sort === 'COUNT_DESC') return b.count - a.count;
        if (sort === 'COUNT_ASC') return a.count - b.count;
        if (sort === 'NAME_ASC') return a.name.localeCompare(b.name);
        if (sort === 'NAME_DESC') return b.name.localeCompare(a.name);
        return 0;
      });

      document.getElementById('resultsCount').textContent = `// MATCHED: ${filteredTags.length} TAGS`;
      
      document.getElementById('tagsGrid').innerHTML = '';
      displayedCount = 0;
      appendNextBatch();
    }

    function appendNextBatch() {
      const grid = document.getElementById('tagsGrid');
      const trigger = document.getElementById('scrollTrigger');

      if (displayedCount >= filteredTags.length) {
        trigger.textContent = filteredTags.length > 0 ? '// END OF TAG ARCHIVE' : '// NO MATCHING TAGS LOCATED';
        return;
      }

      const nextSlice = filteredTags.slice(displayedCount, displayedCount + PAGE_SIZE);
      const fragment = document.createDocumentFragment();

      nextSlice.forEach((tag, idx) => {
        const card = document.createElement('a');
        // Sends query to index.html with the search populated
        //card.href = `index.html?search=${encodeURIComponent(tag.name)}`;
        // Inside tags.html appendNextBatch():
        card.href = `tag.html?tag=${encodeURIComponent(tag.slug)}`;
        card.className = 'tag-card';
        card.setAttribute('aria-label', `Tag: ${tag.name}, containing ${tag.count} files`);

        const indexHex = (displayedCount + idx + 1).toString(16).padStart(3, '0').toUpperCase();

        card.innerHTML = `
          <div>
            <div class="tag-card-top">
              <span class="tag-badge-prefix">//0x${indexHex}</span>
              <span class="tag-count-badge">${tag.count} ${tag.count === 1 ? 'FILE' : 'FILES'}</span>
            </div>
            
            <h2 class="tag-card-name">#${tag.name}</h2>
            <p class="tag-card-desc">${tag.description}</p>
          </div>

          <div class="tag-card-footer">
            <span class="tag-action-label">VIEW PROTOCOLS ↗</span>
            <span class="tag-index-meta">DATA.TAG</span>
          </div>
        `;

        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
      displayedCount += nextSlice.length;

      trigger.textContent = displayedCount >= filteredTags.length ? '// END OF TAG ARCHIVE' : '// SCROLL FOR MORE TAGS...';
    }

    function setupInfiniteScroll() {
      const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) {
          appendNextBatch();
        }
      }, { rootMargin: '200px' });

      observer.observe(document.getElementById('scrollTrigger'));
    }
  </script>
</body>
</html>
