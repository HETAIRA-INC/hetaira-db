<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HETAIRA.EROS // NEURAL TAG INDEX</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="common.js"></script>

  <style>
    :root {
      --bg: #050206;
      --card-bg: rgba(15, 8, 17, 0.85);
      --card-border: rgba(255, 0, 110, 0.22);
      --card-hover-border: #ff007f;
      --neon-pink: #ff007f;
      --crimson-lust: #ff003c;
      --blush-glow: #ff4d8d;
      --cyber-cyan: #00f0ff;
      --cyber-cyan-glow: rgba(0, 240, 255, 0.35);
      --gold-tier: #fcee0a;
      --text-main: #f8fafc;
      --text-muted: #a38896;
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Cyber Grid & Glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 0, 110, 0.12) 0%, transparent 60%),
        linear-gradient(to right, rgba(255, 0, 127, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 127, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 42px 42px, 42px 42px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top Navigation Bar */
    .cyber-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 3, 9, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 0, 127, 0.25);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .nav-container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-decoration: none;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo span {
      color: var(--neon-pink);
      text-shadow: 0 0 20px var(--neon-pink);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      list-style: none;
    }

    .nav-link {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-muted);
      position: relative;
      padding: 6px 2px;
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }

    .nav-link:hover {
      color: #fff;
      text-shadow: 0 0 10px var(--neon-pink);
    }

    .nav-link.active {
      color: var(--neon-pink);
      font-weight: 700;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.7);
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1360px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* Page Header */
    .page-header {
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title span {
      color: var(--cyber-cyan);
      text-shadow: 0 0 15px var(--cyber-cyan-glow);
    }

    .page-subtitle {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Futuristic Filter Panel */
    .filter-bar {
      background: rgba(16, 9, 18, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      align-items: center;
      justify-content: space-between;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 1px rgba(255, 0, 127, 0.4);
      position: relative;
    }

    .filter-bar::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-pink), var(--cyber-cyan), transparent);
    }

    .search-input-wrap {
      flex: 1 1 300px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 0, 127, 0.35);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.85rem 1.1rem;
      outline: none;
      transition: all 0.25s ease;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    .search-input:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.35), inset 0 0 8px rgba(255, 0, 127, 0.2);
    }

    .filter-dropdowns {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .cyber-select {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 0, 127, 0.35);
      color: var(--blush-glow);
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 1px;
      padding: 0.85rem 1.1rem;
      outline: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cyber-select:hover, .cyber-select:focus {
      border-color: var(--cyber-cyan);
      color: var(--cyber-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
    }

    .cyber-select option {
      background: #0f0712;
      color: #fff;
    }

    .count-indicator {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--cyber-cyan);
      text-shadow: 0 0 10px var(--cyber-cyan-glow);
      letter-spacing: 1px;
    }

    /* 4-Tags Per Row Grid Layout */
    .tags-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }

    /* Futuristic Tag Card */
    .tag-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1), 
                  border-color 0.3s ease, 
                  box-shadow 0.3s ease;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      min-height: 220px;
      padding: 1.25rem;
    }

    .tag-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      background: var(--cyber-cyan);
      opacity: 0.4;
      transition: opacity 0.3s ease, background 0.3s ease;
    }

    .tag-card:hover {
      transform: translateY(-6px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 30px -10px rgba(255, 0, 110, 0.4), 0 0 15px rgba(255, 0, 110, 0.2);
    }

    .tag-card:hover::before {
      opacity: 1;
      background: var(--neon-pink);
      box-shadow: 0 0 10px var(--neon-pink);
    }

    .tag-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.85rem;
      gap: 0.5rem;
    }

    .tag-badge-prefix {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--cyber-cyan);
      letter-spacing: 1px;
    }

    .tag-count-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gold-tier);
      background: rgba(252, 238, 10, 0.08);
      border: 1px solid rgba(252, 238, 10, 0.3);
      padding: 2px 7px;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(252, 238, 10, 0.15);
      white-space: nowrap;
    }

    .tag-card-name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.6rem;
      line-height: 1.3;
      letter-spacing: 0.5px;
      word-break: break-word;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .tag-card:hover .tag-card-name {
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.8);
    }

    .tag-card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
      font-weight: 500;
      margin-bottom: 1.2rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tag-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 0, 127, 0.15);
      padding-top: 0.75rem;
      margin-top: auto;
    }

    .tag-action-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--cyber-cyan);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s ease;
    }

    .tag-card:hover .tag-action-label {
      color: var(--neon-pink);
    }

    .tag-index-meta {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* Scroll/State indicator */
    #scrollTrigger {
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--blush-glow);
      margin-top: 3rem;
      position: relative;
    }

    /* Responsive Queries */
    @media (max-width: 1200px) {
      .tags-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 860px) {
      .nav-container {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }
      .nav-links {
        gap: 1.2rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .container { padding: 1.5rem 1rem; }
      .tags-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-bar { padding: 1rem; }
    }

    @media (max-width: 540px) {
      .tags-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="cyber-navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        HETAIRA<span>.EROS</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Files</a></li>
        <li><a href="artists.html" class="nav-link">Artists</a></li>
        <li><a href="tags.html" class="nav-link active">Tags</a></li>
        <li><a href="triggers.html" class="nav-link">Triggers</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <header class="page-header">
      <h1 class="page-title">NEURAL <span>// TAG INDEX</span></h1>
      <p class="page-subtitle">EXPLORE THE ARCHIVE VIA SPECIALIZED PSYCHOACOUSTIC ATTRIBUTES AND THEMES</p>
    </header>

    <!-- Filter & Sort Bar -->
    <div class="filter-bar">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="SEARCH TAGS OR DESCRIPTIONS..." autocomplete="off">
      </div>
      <div class="filter-dropdowns">
        <select id="sortSelect" class="cyber-select" aria-label="Sort Tags By">
          <option value="COUNT_DESC">SORT: MOST FILES</option>
          <option value="COUNT_ASC">SORT: FEWEST FILES</option>
          <option value="NAME_ASC">SORT: NAME (A - Z)</option>
          <option value="NAME_DESC">SORT: NAME (Z - A)</option>
        </select>
      </div>
      <div class="count-indicator" id="resultsCount">// LOADED: 0 TAGS</div>
    </div>

    <!-- 4-Column Tag Grid -->
    <main class="tags-grid" id="tagsGrid"></main>
    <div id="scrollTrigger">// PARSING ATTRIBUTE MATRIX...</div>
  </div>

  <script>
    const { esc } = H;
    // Context dictionary for descriptions; dynamically falls back to an algorithmic description if not listed
    const TAG_DESCRIPTIONS = {
      "hypnosis": "Neural entrainment patterns, trance states, suggestibility induction, and guided sensory immersion.",
      "erotic": "Sensual stimulations, intimate vocal delivery, elevated heart rates, and visceral narrative tension.",
      "whisper": "Close-proximity binaural ASMR acoustics engineered to stimulate sensitive auditory reflex nerves.",
      "femdom": "Dominant female voice guidance, psychological compliance triggers, surrender, and boundary conditioning.",
      "mdom": "Commanding masculine narrative framing, disciplined guidance, deep resonance, and authoritative protocols.",
      "praise": "Positive emotional reinforcement, validation, arousal intensification, and endorphin flooding.",
      "chores": "Conditioned tasks and focus routines integrated with suggestive erotic audio cues.",
      "binaural": "3D spatial positioning audio recorded to simulate real physical proximity and head-space presence.",
      "relaxation": "Theta-wave frequency synchronization for complete physical decompression and nervous system calm.",
      "mind control": "Surrender protocols, identity suspension, deep subconscious looping, and behavioral modifications.",
      "roleplay": "Contextual thematic narratives, character immersion, and specialized conceptual fantasies.",
      "fantasy": "Surreal scenario design, non-standard cybernetic or mythological encounters and settings.",
      "dominant": "Clear directive dominance, commanding tones, and assertive pacing over subject actions.",
      "submissive": "Gentle, compliant voice delivery focused on service, adoration, and passive reception."
    };

    let allTags = [];
    let filteredTags = [];
    let displayedCount = 0;
    const PAGE_SIZE = 24; // Multiples of 4 to keep rows clean
    let kick = () => {};

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const cat = await H.loadCatalog();
        // descriptions come from tags.json (editable in the admin); the built-in table is only a fallback
        allTags = H.termCounts(cat, 'tags').map(t => ({
          slug: t.slug,
          name: t.label,
          lowerName: t.label.toLowerCase(),
          count: t.count,
          description: t.description || TAG_DESCRIPTIONS[t.label.toLowerCase()] ||
            `Specialized acoustic protocol focusing on ${t.label.toLowerCase()} thematic triggers, audio dynamics, and audio-sensory elements.`
        }));

        document.getElementById('searchInput').addEventListener('input', H.debounce(applyFilters, 180));
        document.getElementById('sortSelect').addEventListener('change', applyFilters);
        kick = H.infiniteScroll(document.getElementById('scrollTrigger'), appendNextBatch);
        applyFilters();
      } catch (err) {
        console.error('Failed to load tags:', err);
        document.getElementById('tagsGrid').innerHTML = H.errorBox('CRITICAL NEURAL PARSER ERROR: Unable to index taxonomy tags.');
        document.getElementById('scrollTrigger').textContent = '';
      }
    });

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const sort = document.getElementById('sortSelect').value;

      filteredTags = allTags.filter(t => !query || t.lowerName.includes(query) || t.description.toLowerCase().includes(query));
      H.sortBy(filteredTags, sort, t => t.name, t => t.count);

      document.getElementById('resultsCount').textContent = `// MATCHED: ${filteredTags.length} TAGS`;
      document.getElementById('tagsGrid').innerHTML = '';
      displayedCount = 0;
      if (!appendNextBatch()) document.getElementById('scrollTrigger').textContent = '// NO MATCHING TAGS LOCATED';
      kick();
    }

    function appendNextBatch() {
      const grid = document.getElementById('tagsGrid');
      const trigger = document.getElementById('scrollTrigger');

      if (displayedCount >= filteredTags.length) {
        trigger.textContent = filteredTags.length > 0 ? '// END OF TAG ARCHIVE' : '// NO MATCHING TAGS LOCATED';
        return false;
      }

      const nextSlice = filteredTags.slice(displayedCount, displayedCount + PAGE_SIZE);
      const fragment = document.createDocumentFragment();

      nextSlice.forEach((tag, idx) => {
        const card = document.createElement('a');
        card.href = `tag.html?tag=${encodeURIComponent(tag.slug)}`;
        card.className = 'tag-card';
        card.setAttribute('aria-label', `Tag: ${tag.name}, containing ${tag.count} files`);

        const indexHex = (displayedCount + idx + 1).toString(16).padStart(3, '0').toUpperCase();

        card.innerHTML = `
          <div>
            <div class="tag-card-top">
              <span class="tag-badge-prefix">//0x${indexHex}</span>
              <span class="tag-count-badge">${tag.count} ${tag.count === 1 ? 'FILE' : 'FILES'}</span>
            </div>

            <h2 class="tag-card-name">#${esc(tag.name)}</h2>
            <p class="tag-card-desc">${esc(tag.description)}</p>
          </div>

          <div class="tag-card-footer">
            <span class="tag-action-label">VIEW PROTOCOLS ↗</span>
            <span class="tag-index-meta">DATA.TAG</span>
          </div>
        `;
        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
      displayedCount += nextSlice.length;
      trigger.textContent = displayedCount >= filteredTags.length ? '// END OF TAG ARCHIVE' : '// SCROLL FOR MORE TAGS...';
      return true;
    }
  </script>
</body>
</html>
