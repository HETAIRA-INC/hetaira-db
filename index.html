<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER.NET // SYSTEM NEXUS</title>
  
  <!-- Futuristic Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(14, 20, 32, 0.75);
      --card-border: rgba(0, 240, 255, 0.25);
      --card-border-glow: #00f0ff;
      --accent-neon: #00f0ff;
      --accent-pink: #ff0055;
      --accent-yellow: #fcee0a;
      --text-main: #e2e8f0;
      --text-muted: #8b9bb4;
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient cyber grid background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow vignette */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.1) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    /* Header styling */
    header {
      text-align: center;
      margin-bottom: 4rem;
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--accent-neon);
      text-transform: uppercase;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 6px 14px;
      border-radius: 2px;
      margin-bottom: 1.25rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-neon);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-neon);
      animation: pulse 1.6s infinite ease-in-out;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Grid Layout */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    /* Futuristic Card */
    .cyber-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      
      /* Sci-fi angled corner */
      clip-path: polygon(
        0 0, 
        calc(100% - 20px) 0, 
        100% 20px, 
        100% 100%, 
        20px 100%, 
        0 calc(100% - 20px)
      );

      /* Entrance Animation */
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Corner accent on cards */
    .cyber-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, transparent 50%, var(--accent-neon) 50%);
      pointer-events: none;
    }

    .cyber-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: var(--card-border-glow);
      box-shadow: 0 10px 30px -10px rgba(0, 240, 255, 0.35);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
    }

    .card-id {
      color: var(--accent-pink);
    }

    .card-tag {
      color: var(--accent-yellow);
      background: rgba(252, 238, 10, 0.08);
      padding: 3px 8px;
      border: 1px solid rgba(252, 238, 10, 0.2);
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .card-description {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 2rem;
      flex-grow: 1;
    }

    /* Cyber Button */
    .cyber-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 0.85rem 1.5rem;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--accent-neon);
      background: transparent;
      border: 1px solid var(--accent-neon);
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .cyber-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--accent-neon);
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: -1;
    }

    .cyber-btn:hover {
      color: #000;
      box-shadow: 0 0 18px var(--accent-neon);
    }

    .cyber-btn:hover::before {
      opacity: 1;
    }

    /* Loader */
    .loader {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 0;
      font-family: var(--font-display);
      color: var(--accent-neon);
      letter-spacing: 2px;
      animation: pulse 1s infinite alternate;
    }

    /* Animations */
    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="status-badge">
        <span class="status-dot"></span>
        Mainframe Online // Synced
      </div>
      <h1>Cyber Nexus</h1>
      <p class="subtitle">Access active dynamic subroutines loaded from neural matrix</p>
    </header>

    <!-- Cards container loaded dynamically -->
    <main class="cards-grid" id="cardsContainer">
      <div class="loader">INITIALIZING BUFFER // FETCHING DATA...</div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadCyberCards();
    });

    async function loadCyberCards() {
      const container = document.getElementById('cardsContainer');

      try {
        const response = await fetch('data.json');
        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }
        const cardsData = await response.json();
        renderCards(cardsData, container);
      } catch (error) {
        console.error('Error fetching cards:', error);
        container.innerHTML = `
          <div class="loader" style="color: var(--accent-pink);">
            FAILED TO RETRIEVE TELEMETRY.<br>
            <span style="font-size: 0.8rem; color: var(--text-muted);">
              Ensure data.json is present and the project is served via a local web server (e.g. Live Server).
            </span>
          </div>
        `;
      }
    }

    function renderCards(data, container) {
      container.innerHTML = ''; // Clear loader

      data.forEach((item, index) => {
        const card = document.createElement('article');
        card.className = 'cyber-card';
        // Stagger each card's entrance animation
        card.style.animationDelay = `${index * 0.1}s`;

        card.innerHTML = `
          <div>
            <div class="card-meta">
              <span class="card-id">${item.id || 'SYS-' + (index + 1)}</span>
              <span class="card-tag">${item.tag || 'SUBSYSTEM'}</span>
            </div>
            <h2 class="card-title">${item.title}</h2>
            <p class="card-description">${item.description}</p>
          </div>
          <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="cyber-btn">
            Execute Link &rarr;
          </a>
        `;

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
