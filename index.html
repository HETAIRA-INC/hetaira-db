<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HETAIRA.EROS // EROTIC AUDIO DB</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="common.js"></script>

  <style>
    :root {
      --bg: #070408;
      --card-bg: rgba(18, 10, 19, 0.88);
      --card-border: rgba(255, 0, 85, 0.28);
      --neon-pink: #ff007f;
      --crimson-lust: #ff003c;
      --blush-glow: #ff4d8d;
      --cyber-cyan: #00f0ff;
      --gold-tier: #fcee0a;
      --text-main: #f8fafc;
      --text-muted: #b89ca9;
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 0, 85, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 85, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--blush-glow);
      text-transform: uppercase;
      background: rgba(255, 0, 85, 0.08);
      border: 1px solid rgba(255, 0, 85, 0.35);
      padding: 6px 18px;
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    .heartbeat-icon {
      width: 10px;
      height: 10px;
      background-color: var(--crimson-lust);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--crimson-lust);
      animation: heartbeat 1.2s infinite;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
      margin-bottom: 0.5rem;
    }

    h1 span { color: var(--neon-pink); }

    .filter-bar {
      background: rgba(18, 10, 19, 0.9);
      border: 1px solid rgba(255, 0, 85, 0.3);
      padding: 1.2rem 1.5rem;
      margin-bottom: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
    }

    .search-input-wrap {
      flex: 1 1 280px;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 0, 85, 0.4);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }

    .filter-dropdowns {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .cyber-select {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 0, 85, 0.4);
      color: var(--blush-glow);
      font-family: var(--font-display);
      font-size: 0.75rem;
      padding: 0.75rem 1rem;
      outline: none;
      cursor: pointer;
    }

    .count-indicator {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--cyber-cyan);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.8rem;
    }

    .cyber-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
      transition: transform 0.3s ease, border-color 0.3s ease;
      overflow: hidden;
    }

    .cyber-card:hover {
      transform: translateY(-6px);
      border-color: var(--neon-pink);
      box-shadow: 0 10px 30px -8px rgba(255, 0, 85, 0.45);
    }

    .card-cover-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #120914;
    }

    .card-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .floating-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge-tier {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--gold-tier);
      color: var(--gold-tier);
    }

    .badge-tier.free {
      border-color: var(--cyber-cyan);
      color: var(--cyber-cyan);
    }

    .badge-audience {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      background: rgba(255, 0, 85, 0.85);
      color: #fff;
    }

    .card-body {
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-display);
      font-size: 0.72rem;
      margin-bottom: 0.5rem;
    }

    .card-id { color: var(--blush-glow); font-weight: 700; }
    .card-tag { color: var(--cyber-cyan); }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }

    .card-credits {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }
    .card-credits span { color: var(--blush-glow); }

    .pills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 1rem;
    }

    .tag-pill {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 2px 6px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--cyber-cyan);
    }

    .cyber-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.75rem;
      margin-top: auto;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 0, 85, 0.1);
      border: 1px solid var(--neon-pink);
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      transition: all 0.2s ease;
    }

    .cyber-btn:hover {
      background: linear-gradient(90deg, var(--crimson-lust), var(--neon-pink));
      box-shadow: 0 0 15px var(--neon-pink);
    }

    #scrollTrigger {
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      color: var(--blush-glow);
      margin-top: 2rem;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15%, 45% { transform: scale(1.3); }
    }
    .cyber-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 3, 9, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 0, 127, 0.25);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .nav-container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-decoration: none;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo span {
      color: var(--neon-pink);
      text-shadow: 0 0 20px var(--neon-pink);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      list-style: none;
    }

    .nav-link {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-muted);
      position: relative;
      padding: 6px 2px;
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }

    .nav-link:hover {
      color: #fff;
      text-shadow: 0 0 10px var(--neon-pink);
    }

    .nav-link.active {
      color: var(--neon-pink);
      font-weight: 700;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.7);
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink);
    }


    @media (max-width: 820px) {
      .nav-container { flex-direction: column; gap: 1rem; padding: 1rem; }
      .nav-links { gap: 1.2rem; flex-wrap: wrap; justify-content: center; }
    }

    .active-chips { display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:1rem; }
    .active-chip { font-family: var(--font-mono); font-size:.8rem; color:var(--cyber-cyan); border:1px solid var(--cyber-cyan); padding:4px 10px; cursor:pointer; background:rgba(0,240,255,.07); }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="cyber-navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        HETAIRA<span>.EROS</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link active">Files</a></li>
        <li><a href="artists.html" class="nav-link">Artists</a></li>
        <li><a href="tags.html" class="nav-link">Tags</a></li>
        <li><a href="triggers.html" class="nav-link">Triggers</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <!--<header>
      <div class="status-badge">
        <span class="heartbeat-icon"></span>
        STREAM ENGINE OPTIMIZED // CDN LINK ACTIVE
      </div>
      <h1>HETAIRA<span>.EROS</span></h1>
    </header>-->

    <div class="filter-bar">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="SEARCH PROTOCOLS, TAGS, CREATORS...">
      </div>
      <div class="filter-dropdowns">
        <select id="artistFilter" class="cyber-select" aria-label="Artist">
          <option value="ALL">ARTIST: ALL</option>
        </select>

        <select id="audienceFilter" class="cyber-select">
          <option value="ALL">AUDIENCE: ALL</option>
        </select>

        <select id="tierFilter" class="cyber-select">
          <option value="ALL">TIER: ALL</option>
          <option value="FREE">FREE</option>
          <option value="PAID">PAID</option>
        </select>
      </div>
      <div class="count-indicator" id="resultsCount">// LOADED: 0 RECORDS</div>
    </div>

    <div class="active-chips" id="activeChips"></div>
    <main class="cards-grid" id="cardsGrid"></main>
    <div id="scrollTrigger">// SCROLL FOR MORE PROTOCOLS...</div>
  </div>

  <script>
  console.log("👀 Curious, aren't we?\n🌀 Once you're hypnotized, there's no snapping back! 😵\n*SNAP*\n");
  console.log("If you want to help me improve this library you can go here: https://docs.google.com/spreadsheets/d/1Rjna5Z7m_To7CYBQjItCk1os1DwcupwoTOn9CGrB0u8/edit");

    const { esc } = H;
    const PAGE_SIZE = window.APP_CONFIG.PAGE_SIZE || 12;
    let cat = null;
    let filteredList = [];
    let displayedCount = 0;
    let kick = () => {};
    // filters that come from the URL (links from the Artists / Tags / Triggers pages)
    const urlFilter = { tag: H.q('tag'), trigger: H.q('trigger') };

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        cat = await H.loadCatalog();

        const artistSel = document.getElementById('artistFilter');
        cat.artists.forEach(a => artistSel.add(new Option(a.name, a.slug)));
        const audSel = document.getElementById('audienceFilter');
        [...new Set(cat.items.map(i => (i.audience || '').toUpperCase()).filter(Boolean))].sort()
          .forEach(a => audSel.add(new Option(a, a)));

        // initial values from the URL (?q= or legacy ?search=, ?artist=, ?audience=, ?tier=)
        document.getElementById('searchInput').value = H.q('q') || H.q('search');
        const wantArtist = H.q('artist');
        const hit = cat.artistBySlug.get(wantArtist) || cat.artistByUuid.get(wantArtist) || cat.artists.find(a => H.slugify(a.name) === H.slugify(wantArtist));
        if (hit) artistSel.value = hit.slug;
        if ([...audSel.options].some(o => o.value === H.q('audience').toUpperCase())) audSel.value = H.q('audience').toUpperCase();
        if (['FREE', 'PAID'].includes(H.q('tier').toUpperCase())) document.getElementById('tierFilter').value = H.q('tier').toUpperCase();

        document.getElementById('searchInput').addEventListener('input', H.debounce(applyFilters, 200));
        ['artistFilter', 'audienceFilter', 'tierFilter'].forEach(id => document.getElementById(id).addEventListener('change', applyFilters));

        kick = H.infiniteScroll(document.getElementById('scrollTrigger'), appendNextBatch);
        applyFilters();
      } catch (err) {
        console.error('Failed to load catalog:', err);
        document.getElementById('cardsGrid').innerHTML = H.errorBox('CRITICAL TELEMETRY READ ERROR: Unable to load records catalog.');
        document.getElementById('scrollTrigger').textContent = '';
      }
    });

    function renderChips() {
      const box = document.getElementById('activeChips');
      const chips = [];
      for (const [kind, key, label] of [['tags', 'tag', '#'], ['triggers', 'trigger', '⚠ ']]) {
        if (!urlFilter[key]) continue;
        const e = H.findTerm(cat, kind, urlFilter[key]);
        chips.push(`<span class="active-chip" data-key="${key}">${label}${esc(e ? e.label : urlFilter[key])} ✕</span>`);
      }
      box.innerHTML = chips.join('');
      box.querySelectorAll('.active-chip').forEach(c => c.addEventListener('click', () => { urlFilter[c.dataset.key] = ''; applyFilters(); }));
    }

    function applyFilters() {
      const words = document.getElementById('searchInput').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
      const artist = document.getElementById('artistFilter').value;
      const audience = document.getElementById('audienceFilter').value;
      const tier = document.getElementById('tierFilter').value;
      const tagE = urlFilter.tag && H.findTerm(cat, 'tags', urlFilter.tag);
      const trgE = urlFilter.trigger && H.findTerm(cat, 'triggers', urlFilter.trigger);

      filteredList = cat.items.filter(item =>
        words.every(w => item._q.includes(w)) &&
        (artist === 'ALL' || item._artists.some(a => a.slug === artist)) &&
        (audience === 'ALL' || (item.audience || '').toUpperCase() === audience) &&
        (tier === 'ALL' || (tier === 'FREE') === item._free) &&
        (!urlFilter.tag || (tagE && item._tagEntries.includes(tagE))) &&
        (!urlFilter.trigger || (trgE && item._trigEntries.includes(trgE)))
      );

      // keep the URL shareable
      const p = new URLSearchParams();
      const put = (k, v, off) => v && v !== off && p.set(k, v);
      put('q', document.getElementById('searchInput').value.trim());
      put('artist', artist, 'ALL'); put('audience', audience, 'ALL'); put('tier', tier, 'ALL');
      put('tag', urlFilter.tag); put('trigger', urlFilter.trigger);
      history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));

      renderChips();
      document.getElementById('resultsCount').textContent = `// MATCHED: ${filteredList.length} PROTOCOLS`;
      document.getElementById('cardsGrid').innerHTML = '';
      displayedCount = 0;
      if (!appendNextBatch()) document.getElementById('scrollTrigger').textContent = '// NO MATCHING PROTOCOLS';
      kick();
    }

    /** Renders one batch; returns true if anything was added. */
    function appendNextBatch() {
      const grid = document.getElementById('cardsGrid');
      const trigger = document.getElementById('scrollTrigger');
      if (displayedCount >= filteredList.length) {
        trigger.textContent = filteredList.length > 0 ? '// END OF ARCHIVE RECORDS' : '// NO MATCHING PROTOCOLS';
        return false;
      }

      const nextSlice = filteredList.slice(displayedCount, displayedCount + PAGE_SIZE);
      const fragment = document.createDocumentFragment();

      nextSlice.forEach(item => {
        const tags = item.tags.slice(0, 3);
        const card = document.createElement('article');
        card.className = 'cyber-card';
        card.innerHTML = `
          <div class="card-cover-wrapper">
            <img src="${esc(H.cover(item))}" alt="${esc(item.title || 'Cover')}" class="card-cover" loading="lazy">
            <div class="floating-badges">
              <span class="badge-tier ${item._free ? 'free' : ''}">${esc(item.tier || 'FREE')}</span>
              <span class="badge-audience">${esc(item.audience || 'F4M')}</span>
            </div>
          </div>

          <div class="card-body">
            <div class="card-meta">
              <span class="card-id">${esc(item.id || 'EROS')}</span>
              <span class="card-tag">${esc(item.tag || 'AUDIO')}</span>
            </div>

            <h2 class="card-title">${esc(item.title || 'Untitled')}</h2>
            <div class="card-credits">By <span>${esc(item.author || item._artistNames.join(' × '))}</span></div>

            ${tags.length ? `
              <div class="pills-container">
                ${tags.map(t => `<span class="tag-pill">${esc(t)}</span>`).join('')}
              </div>` : ''}

            <a href="detail.html?id=${encodeURIComponent(item.uuid)}" class="cyber-btn">
              ENGAGE FEED &rarr;
            </a>
          </div>
        `;
        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
      displayedCount += nextSlice.length;
      trigger.textContent = displayedCount >= filteredList.length ? '// END OF ARCHIVE RECORDS' : '// SCROLL FOR MORE PROTOCOLS...';
      return true;
    }
  </script>
</body>
</html>
