<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HETAIRA.EROS // OPERATOR REGISTRY</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="config.js"></script>

  <style>
    :root {
      --bg: #050206;
      --card-bg: rgba(15, 8, 17, 0.85);
      --card-border: rgba(255, 0, 110, 0.22);
      --card-hover-border: #ff007f;
      --neon-pink: #ff007f;
      --crimson-lust: #ff003c;
      --blush-glow: #ff4d8d;
      --cyber-cyan: #00f0ff;
      --cyber-cyan-glow: rgba(0, 240, 255, 0.35);
      --gold-tier: #fcee0a;
      --text-main: #f8fafc;
      --text-muted: #a38896;
      --neon-violet: #bd00ff;
      --neon-violet-glow: rgba(189, 0, 255, 0.4);
      --dark-violet-surface: #14071c; /* Alternative darker card/container layer */
      --toxic-lime: #00ff66;         /* Clean, electric futuristic green */
      --acid-yellow-green: #a6ff00;  /* High-energy hazard accent */
      --matrix-green-glow: rgba(0, 255, 102, 0.25);
      --hazard-orange: #ff5500;      /* Warning badges, overclock states */
      --amber-pulse: #ff8c00;
      --hyper-blue: #1f51ff;         /* Strong contrast against pink & yellow */
      --ice-mint: #50fbe7;           /* Softer, chilled alternative to cyber-cyan */
      --glow-pink-shadow: 0 0 20px rgba(255, 0, 127, 0.45);
      --glow-cyan-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
      --grid-line: rgba(255, 0, 127, 0.08); /* For cyber background grid overlays */
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Cyber Grid & Glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 0, 110, 0.12) 0%, transparent 60%),
        linear-gradient(to right, rgba(255, 0, 127, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 127, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 42px 42px, 42px 42px;
      pointer-events: none;
      z-index: 0;
    }

    /* Futuristic Top Navigation Bar */
    .cyber-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 3, 9, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 0, 127, 0.25);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .nav-container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-decoration: none;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo span {
      color: var(--neon-pink);
      text-shadow: 0 0 20px var(--neon-pink);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      list-style: none;
    }

    .nav-link {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-muted);
      position: relative;
      padding: 6px 2px;
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }

    .nav-link:hover {
      color: #fff;
      text-shadow: 0 0 10px var(--neon-pink);
    }

    .nav-link.active {
      color: var(--neon-pink);
      font-weight: 700;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.7);
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1360px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* Page Header */
    .page-header {
      margin-bottom: 2rem;
      border-left: 3px solid var(--neon-pink);
      padding-left: 1rem;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .page-title span {
      color: var(--neon-violet);
      text-shadow: 0 0 15px var(--neon-violet-glow);
    }

    .page-subtitle {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--neon-violet);
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Futuristic Filter Panel */
    .filter-bar {
      background: rgba(16, 9, 18, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      align-items: center;
      justify-content: space-between;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 1px rgba(255, 0, 127, 0.4);
      position: relative;
    }

    .filter-bar::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-pink), var(--neon-violet), transparent);
    }

    .search-input-wrap {
      flex: 1 1 300px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 0, 127, 0.35);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.85rem 1.1rem;
      outline: none;
      transition: all 0.25s ease;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    .search-input:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.35), inset 0 0 8px rgba(255, 0, 127, 0.2);
    }

    .filter-dropdowns {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .cyber-select {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 0, 127, 0.35);
      color: var(--blush-glow);
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 1px;
      padding: 0.85rem 1.1rem;
      outline: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cyber-select:hover, .cyber-select:focus {
      border-color: var(--cyber-cyan);
      color: var(--cyber-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
    }

    .cyber-select option {
      background: #0f0712;
      color: #fff;
    }

    .count-indicator {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--cyber-cyan);
      text-shadow: 0 0 10px var(--cyber-cyan-glow);
      letter-spacing: 1px;
    }

    /* 3 Artists Per Row Grid Layout */
    .artists-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    /* Clean Interactive Hyperlink Artist Card */
    .cyber-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      transition: transform 0.35s cubic-bezier(0.165, 0.84, 0.44, 1), 
                  border-color 0.35s ease, 
                  box-shadow 0.35s ease;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .cyber-card:hover {
      transform: translateY(-8px);
      border-color: var(--card-hover-border);
      box-shadow: 0 14px 34px -10px rgba(255, 0, 110, 0.45), 0 0 20px rgba(255, 0, 110, 0.2);
    }

    /* Cover Wrapper & Image */
    .card-cover-wrapper {
      position: relative;
      width: 100%;
      height: 260px;
      background-color: #0d0610;
      overflow: hidden;
    }

    .card-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1), filter 0.3s ease;
      filter: brightness(0.92) contrast(1.05);
    }

    .cyber-card:hover .card-cover {
      transform: scale(1.07);
      filter: brightness(1.05) contrast(1.1);
    }

    /* Holographic Scanline Overlay */
    .scanline-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        rgba(18, 10, 20, 0) 50%, 
        rgba(0, 0, 0, 0.45) 50%
      ), linear-gradient(
        90deg, 
        rgba(255,0,0,0.03), 
        rgba(0,255,0,0.01), 
        rgba(0,255,0,0.03)
      );
      background-size: 100% 4px, 6px 100%;
      opacity: 0.6;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .cyber-card:hover .scanline-overlay {
      opacity: 0.25;
    }

    /* Floating Badges on Cover */
    .floating-badges {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 3;
      pointer-events: none;
    }

    .badge-count {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--neon-pink);
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
    }

    .badge-count span {
      color: var(--neon-pink);
    }

    /* Equalizer visualizer element */
    .audio-eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 6px;
      border: 1px solid rgba(255, 0, 127, 0.3);
      border-radius: 2px;
    }

    .eq-bar {
      width: 3px;
      height: 4px;
      background-color: var(--cyber-cyan);
      border-radius: 1px;
      transition: height 0.2s ease;
    }

    .cyber-card:hover .eq-bar:nth-child(1) { animation: eqPulse 0.6s infinite ease-in-out alternate; }
    .cyber-card:hover .eq-bar:nth-child(2) { animation: eqPulse 0.4s infinite ease-in-out alternate 0.15s; }
    .cyber-card:hover .eq-bar:nth-child(3) { animation: eqPulse 0.7s infinite ease-in-out alternate 0.3s; }
    .cyber-card:hover .eq-bar:nth-child(4) { animation: eqPulse 0.5s infinite ease-in-out alternate 0.1s; }

    @keyframes eqPulse {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    /* Card Body */
    .card-body {
      padding: 1.25rem 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-display);
      font-size: 0.72rem;
      margin-bottom: 0.45rem;
      letter-spacing: 1px;
    }

    .card-id { 
      color: var(--blush-glow); 
      font-weight: 700; 
    }

    .card-tag { 
      color: var(--cyber-cyan); 
      font-family: var(--font-mono); 
      opacity: 0.85; 
      text-transform: uppercase;
    }

    .artist-name {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.6rem;
      line-height: 1.35;
      letter-spacing: 0.5px;
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }

    .cyber-card:hover .artist-name {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.8);
    }

    .artist-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Tag Pills */
    .pills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .tag-pill {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 3px 8px;
      background: rgba(0, 240, 255, 0.06);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--cyber-cyan);
      border-radius: 2px;
      letter-spacing: 0.5px;
    }

    /* Card Footer */
    .card-footer {
      border-top: 1px solid rgba(255, 0, 110, 0.2);
      background: rgba(10, 4, 11, 0.9);
      padding: 0.85rem 1.25rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      align-items: center;
      position: relative;
    }

    .card-footer::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
      opacity: 0.6;
    }

    .footer-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .footer-stat:last-child {
      text-align: right;
    }

    .stat-label {
      font-family: var(--font-display);
      font-size: 0.58rem;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #fff;
      font-weight: 700;
    }

    .stat-value.primary {
      color: var(--neon-pink);
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
    }

    .stat-value.secondary {
      color: var(--cyber-cyan);
      text-shadow: 0 0 8px var(--cyber-cyan-glow);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Scroll Trigger */
    #scrollTrigger {
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--blush-glow);
      margin-top: 3rem;
      position: relative;
    }

    /* Responsive Breakdown */
    @media (max-width: 1080px) {
      .artists-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 820px) {
      .nav-container {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }
      .nav-links {
        gap: 1.2rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .container { padding: 1.5rem 1rem; }
      .artists-grid { grid-template-columns: 1fr; }
      .filter-bar { padding: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="cyber-navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        HETAIRA<span>.EROS</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Files</a></li>
        <li><a href="artists.html" class="nav-link active">Artists</a></li>
        <li><a href="tags.html" class="nav-link">Tags</a></li>
        <li><a href="triggers.html" class="nav-link">Triggers</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <header class="page-header">
      <h1 class="page-title">NEURAL <span>// Operator Registry</span></h1>
      <p class="page-subtitle">// DIRECTORY OF CERTIFIED VOICE OPERATORS AND NEURAL ARCHITECTS</p>
    </header>

    <!-- Filter Panel -->
    <div class="filter-bar">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="SEARCH OPERATORS, PREFIXES, ALIASES, OR STYLES..." autocomplete="off">
      </div>
      <div class="filter-dropdowns">
        <select id="sortFilter" class="cyber-select" aria-label="Sort Operators">
          <option value="COUNT_DESC">SORT: MOST FILES</option>
          <option value="COUNT_ASC">SORT: LEAST FILES</option>
          <option value="NAME_ASC">SORT: NAME (A-Z)</option>
          <option value="NAME_DESC">SORT: NAME (Z-A)</option>
        </select>
      </div>
      <div class="count-indicator" id="resultsCount">// LOADED: 0 OPERATORS</div>
    </div>

    <!-- Main Artists Grid: 3 per row -->
    <main class="artists-grid" id="artistsGrid"></main>
    <div id="scrollTrigger">// SCANNING ARTIST REGISTRY...</div>
  </div>

  <script>
    let masterArtists = [];
    let filteredArtists = [];
    let displayedCount = 0;
    const PAGE_SIZE = 12; // Divisible by 3 for clean rows

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const artistsUrl = window.resolveDbUrl ? window.resolveDbUrl(window.APP_CONFIG?.ARTISTS_JSON || 'artists.json') : 'artists.json';

        const res = await fetch(artistsUrl, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

        const catalog = await res.json();
        masterArtists = parseArtistsDataset(catalog);

        document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 200));
        document.getElementById('sortFilter').addEventListener('change', applyFilters);

        applyFilters();
        setupInfiniteScroll();
      } catch (err) {
        console.error('Failed to load artist registry:', err);
        document.getElementById('artistsGrid').innerHTML = `
          <div style="grid-column: 1 / -1; color: var(--crimson-lust); text-align: center; padding: 3rem; font-family: var(--font-mono);">
            CRITICAL TELEMETRY READ ERROR: Unable to load operator index from artists.json.
          </div>`;
      }
    });

    // Parse records from artists.json
    function parseArtistsDataset(records) {
      if (!Array.isArray(records)) return [];

      const FALLBACK_ART = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#120715"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#33001f" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grid)"/>
  <circle cx="200" cy="175" r="65" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  <polygon points="200,135 235,195 165,195" fill="none" stroke="#ff007f" stroke-width="2"/>
  <text x="200" y="275" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ff4d8d">[ NO COVER ARTWORK ]</text>
  <text x="200" y="300" text-anchor="middle" font-family="monospace" font-size="11" fill="#00f0ff">// SIGNAL_OFFLINE</text>
</svg>
`)}`;
      return records
        .filter(item => !item.status || item.status === 'ACTIVE')
        .map(item => {
          const count = typeof item.recordCount === 'number' ? item.recordCount : 0;
          return {
            uuid: item.uuid || '',
            slug: item.slug || '',
            name: item.name || 'Anonymous',
            aliases: Array.isArray(item.aliases) ? item.aliases : [],
            idPrefix: item.idPrefix || 'EROS-OP-',
            site: item.site || '',
            defaultTag: item.defaultTag || 'NEURAL TRANSMISSION',
            status: item.status || 'ACTIVE',
            cover: item.cover ? `${item.uuid}/${item.cover}` : FALLBACK_ART,
            description: item.description || `Specialized vocal operator archived with ${count} erotic audio transmission${count !== 1 ? 's' : ''} in the Hetaira neural databank.`,
            count: count
          };
        });
    }

    function debounce(fn, ms) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), ms);
      };
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const sort = document.getElementById('sortFilter').value;

      filteredArtists = masterArtists.filter(artist => {
        if (!query) return true;
        const nameMatch = artist.name.toLowerCase().includes(query);
        const prefixMatch = artist.idPrefix.toLowerCase().includes(query);
        const tagMatch = artist.defaultTag.toLowerCase().includes(query);
        const descMatch = artist.description.toLowerCase().includes(query);
        const aliasesMatch = artist.aliases.some(alias => alias.toLowerCase().includes(query));
        return nameMatch || prefixMatch || tagMatch || descMatch || aliasesMatch;
      });

      // Sorting
      filteredArtists.sort((a, b) => {
        if (sort === 'COUNT_DESC') return b.count - a.count;
        if (sort === 'COUNT_ASC') return a.count - b.count;
        if (sort === 'NAME_ASC') return a.name.localeCompare(b.name);
        if (sort === 'NAME_DESC') return b.name.localeCompare(a.name);
        return 0;
      });

      document.getElementById('resultsCount').textContent = `// LOADED: ${filteredArtists.length} OPERATORS`;

      // Reset
      document.getElementById('artistsGrid').innerHTML = '';
      displayedCount = 0;
      appendNextBatch();
    }

    function appendNextBatch() {
      const grid = document.getElementById('artistsGrid');
      const trigger = document.getElementById('scrollTrigger');

      if (displayedCount >= filteredArtists.length) {
        trigger.textContent = filteredArtists.length > 0 ? '// END OF OPERATOR REGISTRY' : '// NO MATCHING OPERATORS FOUND';
        return;
      }

      const nextSlice = filteredArtists.slice(displayedCount, displayedCount + PAGE_SIZE);
      const fragment = document.createDocumentFragment();
      const resolveFn = window.resolveAssetUrl || (url => url);
      const FALLBACK_ART = resolveFn('covers/fallback_cover.png', 'cover');

      nextSlice.forEach(artist => {
        const coverSrc = artist.cover ? resolveFn(artist.cover, 'cover') : FALLBACK_ART;
        const targetUrl = `artist.html?uuid=${encodeURIComponent(artist.uuid)}`;
        const codePrefix = artist.idPrefix ? artist.idPrefix.replace(/-+$/, '') : `OP // ${artist.name.slice(0, 3).toUpperCase()}`;

        // Generate aliases / style pills
        const pills = [...artist.aliases.slice(0, 3)].filter(Boolean);

        const card = document.createElement('a');
        card.href = targetUrl;
        card.className = 'cyber-card';
        card.setAttribute('aria-label', `View protocols by ${artist.name}`);

        card.innerHTML = `
          <div class="card-cover-wrapper">
            <img src="${coverSrc}" 
                 alt="${artist.name}" 
                 class="card-cover" 
                 loading="lazy" 
                 onerror="this.onerror=null; this.src='${FALLBACK_ART}';">
            
            <div class="scanline-overlay"></div>

            <div class="floating-badges">
              <span class="badge-count">FILES: <span>${artist.count}</span></span>
              
              <div class="audio-eq-bars" title="Vocal Frequency Verified">
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
              </div>
            </div>
          </div>

          <div class="card-body">
            <div class="card-meta">
              <span class="card-id">OP // ${codePrefix.slice(5, 7).toUpperCase()}</span>
              <span class="card-tag">${artist.defaultTag}</span>
            </div>
            
            <h2 class="artist-name">${artist.name}</h2>
            <p class="artist-desc">${artist.description}</p>

            ${pills.length ? `
              <div class="pills-container">
                ${pills.map(tag => `<span class="tag-pill">${tag}</span>`).join('')}
              </div>` : ''}
          </div>

          <footer class="card-footer">
            <div class="footer-stat">
              <span class="stat-label">TOTAL ARCHIVED</span>
              <span class="stat-value primary">${artist.count} TRANSMISSION${artist.count !== 1 ? 'S' : ''}</span>
            </div>
            <div class="footer-stat">
              <span class="stat-label">DESIGNATION</span>
              <span class="stat-value secondary" title="${artist.slug || artist.uuid}">${artist.slug || 'ACTIVE'}</span>
            </div>
          </footer>
        `;
        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
      displayedCount += nextSlice.length;

      trigger.textContent = displayedCount >= filteredArtists.length ? '// END OF OPERATOR REGISTRY' : '// SCROLL FOR MORE OPERATORS...';
    }

    function setupInfiniteScroll() {
      const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) {
          appendNextBatch();
        }
      }, { rootMargin: '250px' });

      observer.observe(document.getElementById('scrollTrigger'));
    }
  </script>
</body>
</html>
