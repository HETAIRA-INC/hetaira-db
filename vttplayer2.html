<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAMARITAN // RESONANCE PLAYER</title>
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --samaritan-crimson: #ff2a55;
      --samaritan-glow: rgba(255, 42, 85, 0.45);
      --samaritan-deep-glow: rgba(255, 42, 85, 0.12);
      --zen-black: #040508;
      --zen-white: #f3f6fa;
      --muted-gray: rgba(255, 255, 255, 0.4);
      --hud-border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #080d16 0%, #030407 100%);
      color: var(--zen-white);
      font-family: 'Outfit', sans-serif;
    }

    /* Ambient Canvas */
    #ambientCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.8) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Framing Brackets */
    .hud-frame {
      position: absolute;
      inset: 20px;
      pointer-events: none;
      border: 1px solid var(--hud-border);
      border-radius: 4px;
      z-index: 5;
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--samaritan-crimson);
      border-style: solid;
      opacity: 0.85;
      filter: drop-shadow(0 0 6px var(--samaritan-glow));
    }
    .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    /* Header */
    .hud-header {
      position: absolute;
      top: 32px;
      left: 40px;
      right: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Space Grotesk', monospace;
      font-size: 0.78rem;
      letter-spacing: 3px;
      color: var(--muted-gray);
      z-index: 6;
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .system-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }

    .badge-pill {
      background: linear-gradient(135deg, var(--samaritan-crimson), #c40030);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: 1.5px;
      box-shadow: 0 0 12px var(--samaritan-glow);
      text-transform: uppercase;
    }

    #remainingTime {
      color: var(--samaritan-crimson);
      font-weight: 700;
      text-shadow: 0 0 10px var(--samaritan-glow);
    }

    /* Central Hypnotic Word Display */
    .viewport-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 4;
      pointer-events: none;
      padding: 0 5vw;
    }

    .samaritan-word {
      font-size: clamp(3.2rem, 9.5vw, 7.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.3), 0 0 80px var(--samaritan-deep-glow);
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.28s ease, opacity 0.2s ease;
      opacity: 1;
      filter: blur(0px);
      margin-bottom: 20px;
    }

    .samaritan-word.transitioning {
      opacity: 0.35;
      filter: blur(6px);
      transform: scale(0.97);
    }

    .samaritan-marker {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 22px solid var(--samaritan-crimson);
      filter: drop-shadow(0 0 14px var(--samaritan-crimson));
      animation: hypnoticFloat 3.8s ease-in-out infinite alternate;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes hypnoticFloat {
      0% { transform: translateY(0px) scale(0.95); opacity: 0.75; }
      100% { transform: translateY(8px) scale(1.05); opacity: 1; filter: drop-shadow(0 0 24px rgba(255, 42, 85, 0.9)); }
    }

    /* Controls Dock */
    .hud-controls {
      position: absolute;
      bottom: 32px;
      left: 40px;
      right: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      z-index: 20;
      font-family: 'Space Grotesk', monospace;
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s ease;
    }

    .autohide {
      opacity: 0.05 !important;
      transform: translateY(6px);
    }

    body:hover .autohide {
      opacity: 1 !important;
      transform: translateY(0);
    }

    .playback-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--zen-white);
      padding: 10px 18px;
      font-family: 'Space Grotesk', monospace;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
    }

    .hud-btn:hover {
      background: var(--samaritan-crimson);
      border-color: var(--samaritan-crimson);
      box-shadow: 0 0 20px var(--samaritan-glow);
      color: #fff;
      transform: translateY(-2px);
    }

    .progress-container {
      flex: 1;
      max-width: 700px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .progress-track-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      position: relative;
      border-radius: 4px;
    }

    .progress-filled {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff2a55, #ff6b8b);
      border-radius: 4px;
      box-shadow: 0 0 14px var(--samaritan-crimson);
    }

    .time-readout {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--muted-gray);
    }

    /* Modal for ID entry */
    .selection-modal {
      position: absolute;
      inset: 0;
      background: rgba(4, 5, 8, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      font-family: 'Space Grotesk', monospace;
    }

    .selection-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 90%;
      max-width: 450px;
      background: rgba(18, 22, 32, 0.6);
      border: 1px solid rgba(255, 42, 85, 0.3);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 25px var(--samaritan-deep-glow);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 30px;
    }

    .modal-box h2 {
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: #fff;
      margin-bottom: 20px;
      text-align: center;
      border-bottom: 1px solid var(--hud-border);
      padding-bottom: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .input-group label {
      font-size: 0.75rem;
      color: var(--muted-gray);
      letter-spacing: 2px;
    }

    .modal-input {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      color: #f3f6fa;
      font-family: 'Space Grotesk', monospace;
      padding: 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-input:focus {
      border-color: var(--samaritan-crimson);
      box-shadow: 0 0 10px var(--samaritan-glow);
    }

    .btn-large {
      background: var(--samaritan-crimson);
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 3px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 20px var(--samaritan-glow);
      font-family: 'Space Grotesk', monospace;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .btn-large:active {
      transform: scale(0.98);
    }

    /* Small/Landscape Adjustments */
    @media (max-height: 520px) {
      .hud-frame { inset: 8px; }
      .hud-header { top: 14px; left: 20px; right: 20px; font-size: 0.68rem; }
      .hud-controls { bottom: 14px; left: 20px; right: 20px; gap: 12px; }
      .samaritan-word { font-size: clamp(2.2rem, 8vw, 3.8rem); margin-bottom: 10px; }
      .samaritan-marker { border-left-width: 8px; border-right-width: 8px; border-bottom-width: 14px; }
      .hud-btn { padding: 8px 12px; font-size: 0.68rem; }
    }
  </style>
</head>
<body>

  <canvas id="ambientCanvas"></canvas>
  <div class="vignette"></div>

  <!-- HUD Framing -->
  <div class="hud-frame" id="hudFrame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>

  <!-- Telemetry Header -->
  <div class="hud-header" id="hudHeader">
    <div class="system-badge">
      <span class="badge-pill" id="trackTitle">AWAITING DATA...</span>
    </div>
    <div id="remainingTime">-00:00.0</div>
  </div>

  <!-- Hypnotic Center Display -->
  <div class="viewport-center">
    <div class="samaritan-word" id="wordDisplay">INITIALIZING</div>
    <div class="samaritan-marker" id="marker"></div>
  </div>

  <!-- Glass Controls Dock -->
  <div class="hud-controls" id="hudControls">
    <div class="playback-group">
      <button class="hud-btn" id="playBtn">▶ PLAY</button>
    </div>

    <div class="progress-container">
      <button class="hud-btn" id="rwBtn">⏪ 10S</button>
      
      <div class="progress-track-wrapper">
        <div class="progress-bar" id="progressBar">
          <div class="progress-filled" id="progressFilled"></div>
        </div>
        <div class="time-readout">
          <span id="currentTime">00:00.0</span>
          <span id="threatStatus" style="color:var(--samaritan-crimson);">FLOW STATE: LOCKED</span>
          <span id="totalTime">00:00.0</span>
        </div>
      </div>

      <button class="hud-btn" id="ffBtn">10S ⏩</button>
    </div>

    <div class="playback-group">
      <button class="hud-btn" id="fsBtn">FULLSCREEN</button>
    </div>
  </div>

  <!-- Selection Modal (Fallback if URL params are missing) -->
  <div class="selection-modal" id="selectionModal">
    <div class="modal-box">
      <h2>SYSTEM OVERRIDE</h2>
      <div class="input-group">
        <label>ARTIST UUID</label>
        <input type="text" class="modal-input" id="inputArtist" placeholder="e.g. 7ce7929c-...">
      </div>
      <div class="input-group">
        <label>AUDIO UUID</label>
        <input type="text" class="modal-input" id="inputUuid" placeholder="e.g. 0d16535d-...">
      </div>
      <button class="btn-large" id="loadDataBtn">INITIALIZE PROTOCOL</button>
    </div>
  </div>

  <audio id="audioSource" preload="metadata"></audio>

  <script>
    // DOM References
    const audio = document.getElementById('audioSource');
    const wordDisplay = document.getElementById('wordDisplay');
    const marker = document.getElementById('marker');
    const playBtn = document.getElementById('playBtn');
    const rwBtn = document.getElementById('rwBtn');
    const ffBtn = document.getElementById('ffBtn');
    const fsBtn = document.getElementById('fsBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFilled = document.getElementById('progressFilled');
    const currentTimeDisp = document.getElementById('currentTime');
    const totalTimeDisp = document.getElementById('totalTime');
    const remainingTimeDisp = document.getElementById('remainingTime');
    const trackTitleDisp = document.getElementById('trackTitle');
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    
    // Auto-hide References
    const hudFrame = document.getElementById('hudFrame');
    const hudHeader = document.getElementById('hudHeader');
    const hudControls = document.getElementById('hudControls');
    
    // Modal References
    const selectionModal = document.getElementById('selectionModal');
    const inputArtist = document.getElementById('inputArtist');
    const inputUuid = document.getElementById('inputUuid');
    const loadDataBtn = document.getElementById('loadDataBtn');

    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let lastRenderedIndex = -1;
    let idleTimer = null;
    let transcript = [];

    // ==========================================
    // DATA FETCHING & INITIALIZATION
    // ==========================================
    
    // Check URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const uuidParam = urlParams.get('uuid');
    const artistParam = urlParams.get('artist');

    const UUID_RE = /^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i;
    if (!UUID_RE.test(uuidParam) || !UUID_RE.test(artistParam)) {
      selectionModal.classList.add('open');
    } else {
      initializePlayer(artistParam.toLowerCase(), uuidParam.toLowerCase());
    }

    loadDataBtn.addEventListener('click', () => {
      const aId = inputArtist.value.trim();
      const uId = inputUuid.value.trim();
      if (aId && uId) {
        window.location.href = `?uuid=${uId}&artist=${aId}`;
      }
    });

    async function initializePlayer(artist, uuid) {
      try {
        // hetaira-data: <artist>/records/<uuid>.json   hetaira-c1: <artist>/vtt|audio/<uuid>.*
        // vtt is plain text, so it uses the raw (non-LFS) base; audio uses the LFS base.
        const vttUrl = resolveAssetUrl(`${artist}/vtt/${uuid}.vtt`, 'cover');
        let audioUrl = resolveAssetUrl(`${artist}/audio/${uuid}.mp3`, 'audio');

        try {
          const metaRes = await fetch(resolveDbUrl(`${artist}/records/${uuid}.json`));
          if (!metaRes.ok) throw new Error(`HTTP ${metaRes.status}`);
          const meta = await metaRes.json();
          trackTitleDisp.textContent = meta.title || "SAMARITAN PROTOCOL";
          if (meta.file) audioUrl = resolveAssetUrl(meta.file, 'audio'); // records may use wav/flac/... or a full URL
        } catch (err) {
          console.warn("Could not load record JSON. Using default title.", err);
          trackTitleDisp.textContent = "SAMARITAN PROTOCOL";
        }

        // Fetch VTT file
        const vttRes = await fetch(vttUrl);
        if (vttRes.ok) {
          const vttText = await vttRes.text();
          transcript = parseVttToTimedWords(vttText);
          transitionWord("STANDBY");
        } else {
          transitionWord("VTT ERROR");
        }

        // Load Audio (crossOrigin: createMediaElementSource mutes cross-origin media without it)
        audio.crossOrigin = 'anonymous';
        audio.onerror = () => transitionWord("AUDIO ERROR");
        audio.src = audioUrl;
        audio.onloadedmetadata = () => {
          totalTimeDisp.textContent = formatTime(audio.duration);
          updateRemainingTime(0, audio.duration);
        };

      } catch (error) {
        console.error("Error initializing player:", error);
        transitionWord("SYSTEM FAILURE");
      }
    }

    // ==========================================
    // VTT PARSING ENGINE (Updated for Intra-word & Auto-distribute)
    // ==========================================
    
    function timeToSeconds(timeStr) {
      const parts = timeStr.split(/[:.,]/);
      let hours = 0, mins = 0, secs = 0, ms = 0;
      if (parts.length === 4) {
        hours = parseInt(parts[0], 10);
        mins = parseInt(parts[1], 10);
        secs = parseInt(parts[2], 10);
        ms = parseInt(parts[3], 10);
      } else if (parts.length === 3) {
        mins = parseInt(parts[0], 10);
        secs = parseInt(parts[1], 10);
        ms = parseInt(parts[2], 10);
      }
      return hours * 3600 + mins * 60 + secs + (ms / 1000);
    }

    function parseVttToTimedWords(vttText) {
      const lines = vttText.split(/\r?\n/);
      const results = [];
      const cueTimeRegex = /(?:(\d{2}):)?(\d{2}):(\d{2})[.,](\d{3})\s*-->\s*(?:(\d{2}):)?(\d{2}):(\d{2})[.,](\d{3})/;

      for (let i = 0; i < lines.length; i++) {
        const match = lines[i].match(cueTimeRegex);
        if (match) {
          const startHours = parseInt(match[1] || "0", 10);
          const startMinutes = parseInt(match[2], 10);
          const startSeconds = parseInt(match[3], 10);
          const startMillis = parseInt(match[4], 10);
          const cueStartTime = startHours * 3600 + startMinutes * 60 + startSeconds + (startMillis / 1000);

          const endHours = parseInt(match[5] || "0", 10);
          const endMinutes = parseInt(match[6], 10);
          const endSeconds = parseInt(match[7], 10);
          const endMillis = parseInt(match[8], 10);
          const cueEndTime = endHours * 3600 + endMinutes * 60 + endSeconds + (endMillis / 1000);

          let j = i + 1;
          let currentWordTime = cueStartTime; 
          let cueWords = [];

          while (j < lines.length && lines[j].trim() !== '') {
            const chunks = lines[j].trim().split(/\s+/);

            for (let chunk of chunks) {
              if (!chunk) continue;

              const tagMatch = chunk.match(/<((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})>/);
              if (tagMatch) currentWordTime = timeToSeconds(tagMatch[1]);
              
              let cleanWord = chunk.replace(/<[^>]+>/g, '').replace(/[.,?!"]/g, '');
              if (cleanWord) cueWords.push({ word: cleanWord.toUpperCase(), time: currentWordTime });
            }
            j++;
          }

          // Sentence-by-sentence auto-distribution fallback
          if (cueWords.length > 1) {
            const allSameTime = cueWords.every(cw => cw.time === cueWords[0].time);
            if (allSameTime) {
              const duration = cueEndTime - cueStartTime;
              const step = Math.max(duration / cueWords.length, 0.1); 
              cueWords.forEach((cw, index) => {
                cw.time = Number((cueStartTime + (step * index)).toFixed(3));
              });
            }
          }
          results.push(...cueWords);
        }
      }
      return results;
    }

    // ==========================================
    // AUDIO & VISUAL LOGIC
    // ==========================================

    function setupAudioNodes() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.88;
      sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    // Hypnotic Ripple & Canvas Rendering
    let ripplePhase = 0;
    function drawHypnoticField() {
      requestAnimationFrame(drawHypnoticField);
      const w = canvas.width = window.innerWidth;
      const h = canvas.height = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      let energy = 0.15;
      if (analyser) {
        const buffer = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(buffer);
        let sum = 0;
        for (let i = 0; i < buffer.length; i++) sum += buffer[i];
        energy = Math.max(0.12, (sum / buffer.length) / 95);
      }

      ripplePhase += 0.012 + (energy * 0.01);
      const centerX = w / 2;
      const centerY = h / 2;

      for (let r = 1; r <= 7; r++) {
        const radius = (r * 65 + Math.sin(ripplePhase + r * 0.8) * 25) * (0.8 + energy * 0.4);
        const alpha = Math.max(0.02, (1 - (r / 7)) * 0.22 * energy);
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 42, 85, ${alpha})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      for (let layer = 0; layer < 2; layer++) {
        const offset = layer * 1.5;
        ctx.beginPath();
        ctx.moveTo(0, h * 0.65);
        for (let x = 0; x <= w; x += 15) {
          const y = (h * 0.65) + 
                    Math.sin(x * 0.003 + ripplePhase + offset) * (20 * energy) +
                    Math.cos(x * 0.007 - ripplePhase * 0.5) * (15 * energy);
          ctx.lineTo(x, y);
        }
        ctx.strokeStyle = layer === 0 ? `rgba(255, 42, 85, ${0.1 + energy * 0.18})` : `rgba(255, 255, 255, 0.05)`;
        ctx.lineWidth = layer === 0 ? 2 : 1;
        ctx.stroke();
      }
    }
    drawHypnoticField();

    function transitionWord(word) {
      wordDisplay.classList.add('transitioning');
      marker.style.transform = 'translateY(16px) scale(1.1)';
      setTimeout(() => {
        wordDisplay.textContent = word;
        wordDisplay.classList.remove('transitioning');
        marker.style.transform = 'translateY(8px) scale(1)';
      }, 160);
    }

    async function togglePlay() {
      if (!audio.src) return;
      setupAudioNodes();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      if (audio.paused) {
        audio.play();
        playBtn.textContent = "❚❚ PAUSE";
      } else {
        audio.pause();
        playBtn.textContent = "▶ PLAY";
      }
    }
    
    playBtn.addEventListener('click', togglePlay);

    // Audio Playback Sync
    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      const total = audio.duration || 1;

      progressFilled.style.width = `${(cur / total) * 100}%`;
      currentTimeDisp.textContent = formatTime(cur);
      updateRemainingTime(cur, total);

      let activeIndex = -1;
      for (let i = 0; i < transcript.length; i++) {
        if (cur >= transcript[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== -1 && activeIndex !== lastRenderedIndex) {
        transitionWord(transcript[activeIndex].word);
        lastRenderedIndex = activeIndex;
      }
    });

    audio.addEventListener('ended', () => {
      playBtn.textContent = "▶ PLAY";
      lastRenderedIndex = -1;
    });

    // Formatting & Time Math
    function formatTime(secs) {
      if (isNaN(secs) || !isFinite(secs)) return "00:00.0";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      const ms = Math.floor((secs % 1) * 10);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${ms}`;
    }

    function updateRemainingTime(current, total) {
      if (isNaN(total) || !isFinite(total)) return;
      const remaining = Math.max(0, total - current);
      const m = Math.floor(remaining / 60);
      const s = Math.floor(remaining % 60);
      remainingTimeDisp.textContent = `-${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    progressBar.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
      lastRenderedIndex = -1;
    });

    // Rewind / Fast Forward
    rwBtn.addEventListener('click', () => {
      if(audio.duration) audio.currentTime = Math.max(0, audio.currentTime - 10);
      lastRenderedIndex = -1;
    });
    
    ffBtn.addEventListener('click', () => {
      if(audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
      lastRenderedIndex = -1;
    });

    // Fullscreen Mode
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else if (document.exitFullscreen) document.exitFullscreen();
    });

    // Autohide Zen Mode
    function resetIdleTimer() {
      hudControls.classList.remove('autohide');
      hudHeader.classList.remove('autohide');
      hudFrame.classList.remove('autohide');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (!audio.paused) {
          hudControls.classList.add('autohide');
          hudHeader.classList.add('autohide');
          hudFrame.classList.add('autohide');
        }
      }, 3500);
    }
    window.addEventListener('mousemove', resetIdleTimer);
    window.addEventListener('touchstart', resetIdleTimer);

  </script>
</body>
